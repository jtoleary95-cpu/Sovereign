const polTurnKind=(S,n)=>pol(S)&&isTermEnd(S)?(n.deposed?"struggle":n.gov==="dem"?"campaign":"consolidation"):null;
function initPolitics(n){const _p=n.human?"A":pick(["A","B"]);n.good={work:0,bus:0,nat:0,ref:0};n.govTerms=0;n.fac={};for(const f of FAC)n.fac[f]={size:25,appr:50};n.lean={work:0,bus:0,nat:0,ref:0};n.climPush={dem:0,mon:0,dic:0};n.loyalty=60;
  n.pr={won:0,lost:0,cas:0,conc:0};n.camp={regions:{},nat:0};n.govParty=_p;n.myParty=_p;n.partyChosen=!n.human;n.demand=null;n.lastElection=null;n.oppBlock=false}
function tradeCount(S,id){return alive(S).filter(o=>o!==id&&rel(S,id,o)?.trade).length}
function warCount(S,id){return alive(S).filter(o=>o!==id&&atWar(S,id,o)).length}
function allyCount(S,id){return alive(S).filter(o=>allied(S,id,o)).length}
/* the approval each faction is drifting toward, for a given tax/budget */
function facTargets(S,id,tax,b){const n=S.nations[id],pr=n.pr,u=n.unrest,mil=(b.troops||0)+(b.def||0);
  const t={
    work:55-(tax-20)*0.8+(b.infra||0)*0.4-Math.max(0,(b.troops||0)-20)*0.25-Math.min(12,pr.cas*0.3),
    bus:50-(tax-20)*0.8+tradeCount(S,id)*8-Math.max(0,u-40)*0.3,
    nat:50+(mil-30)*0.4+pr.won*4-pr.lost*5-pr.conc*10,
    ref:50+(n.gov==="dem"?10:n.gov==="dic"?-15:0)-(u-30)*0.3+allyCount(S,id)*5+tradeCount(S,id)*3-(b.prop||0)*0.3-warCount(S,id)*4};
  for(const f of FAC)t[f]=clamp(Math.round(t[f]+(n.good?.[f]||0)),0,100);return t}
function climate(n){const s=n.fac,base={dem:s.ref.size+s.work.size/2,mon:s.bus.size,dic:s.nat.size+s.work.size/2};let tot=0;const c={};
  for(const g of ["dem","mon","dic"]){c[g]=Math.max(1,base[g]+n.climPush[g]);tot+=c[g]}for(const g in c)c[g]=Math.round(c[g]*100/tot);return c}
function loyaltyTarget(S,n){if(n.gov==="dic")return clamp(38+((n.budget.troops||0)+(n.budget.def||0)-30)*0.5+n.pr.won*4-n.pr.lost*9-warCount(S,n.id)*3,0,100);
  if(n.gov==="mon")return clamp(42+(n.fac.bus.appr-50)*0.6-(n.tax-25)*0.9,0,100);return 60}
function addLean(n,f,v){n.lean[f]=clamp((n.lean[f]||0)+v,-40,40)}
function facShift(n,f,d){n.fac[f].size=Math.max(8,n.fac[f].size+d);const t=FAC.reduce((a,x)=>a+n.fac[x].size,0);for(const x of FAC)n.fac[x].size=Math.round(n.fac[x].size*1000/t)/10}
function appr(n,f,d){n.fac[f].appr=clamp(n.fac[f].appr+d,0,100)}
function politicsTurn(S,id){const n=S.nations[id];if(!n.fac)initPolitics(n);
  if(!n.good)n.good={work:0,bus:0,nat:0,ref:0};for(const f of FAC)n.good[f]*=0.93;
  const T=facTargets(S,id,n.tax,n.budget);for(const f of FAC)n.fac[f].appr+= (T[f]-n.fac[f].appr)*0.25;
  // slow drift in faction sizes
  const mil=(n.budget.troops||0)+(n.budget.def||0);facShift(n,"nat",(mil-30)*0.02+n.lostThisTurn*1+(n.pr.won>0?0.2:0));facShift(n,"work",n.tax>35?0.3:0);facShift(n,"bus",tradeCount(S,id)*0.2);facShift(n,"ref",n.gov==="dem"?0.2:-0.1);
  // unhappy factions raise unrest
  n.unrest=clamp(n.unrest+FAC.reduce((a,f)=>a+n.fac[f].size/100*Math.max(0,40-n.fac[f].appr)*0.12,0),0,100);
  for(const g in n.climPush)n.climPush[g]*=0.9;for(const f of FAC)n.lean[f]*=0.95;for(const k in n.pr)n.pr[k]*=0.85;
  if(n.gov!=="dem"){n.loyalty+=(loyaltyTarget(S,n)-n.loyalty)*0.2;n.loyalty=clamp(n.loyalty,0,100);
    if(n.loyalty<50){const p=Math.pow((50-n.loyalty)/50,2)*0.35;if(chance(p)){if(n.gov==="dic")coup(S,id,"disloyal army");else crisis(S,id,"disloyal nobles");n.loyalty=45}}}}
/* demands */
const DEMANDS={
  work:[{k:"taxMax",v:25,t:"Keep taxes at 25% or less"},{k:"infraMin",v:20,t:"Put at least 20% of the budget into infrastructure"}],
  bus:[{k:"taxMax",v:25,t:"Keep taxes at 25% or less"},{k:"trade",v:1,t:"Sign a new trade deal this term"}],
  nat:[{k:"milMin",v:45,t:"Spend at least 45% on troops and defenses"},{k:"capture",v:1,t:"Capture a region this term"}],
  ref:[{k:"propMax",v:5,t:"Spend 5% or less on propaganda"},{k:"noWar",v:0,t:"Start no new wars this term"}]};
function makeDemand(S,id){const n=S.nations[id];if(n.deposed){n.demand=null;return}if(n.gov==="dem"&&!govMine(n)){n.demand=null;return}let best=null,bv=-1;for(const f of FAC){const v=n.fac[f].size*(100-n.fac[f].appr);if(v>bv){bv=v;best=f}}
  const d=pick(DEMANDS[best]);n.demand={f:best,...d,start:S.turn,trades:tradeCount(S,id),wins:n.termWins,wars:0};S.log.push({t:Math.max(0,S.turn-1),to:id,text:`${FACN[best]} demand for the coming term: ${d.t}. Set your policy this turn to meet it.`})}
function demandMet(S,id){const n=S.nations[id],d=n.demand;if(!d)return true;const b=n.budget;
  return d.k==="taxMax"?n.tax<=d.v:d.k==="infraMin"?b.infra>=d.v:d.k==="milMin"?(b.troops+b.def)>=d.v:d.k==="propMax"?b.prop<=d.v:d.k==="trade"?tradeCount(S,id)>d.trades:d.k==="capture"?n.termWins>0:d.k==="noWar"?!(d.wars>0):true}
function settleDemand(S,id){const n=S.nations[id],d=n.demand;if(!d)return;if(!n.good)n.good={work:0,bus:0,nat:0,ref:0};
  if(demandMet(S,id)){appr(n,d.f,10);n.good[d.f]+=12;addLean(n,d.f,10);log(S,id,`You met the ${FACN[d.f]}' demand. They're grateful and lean your way.`)}
  else{appr(n,d.f,-10);n.good[d.f]-=10;addLean(n,d.f,-20);log(S,id,`You ignored the ${FACN[d.f]}' demand. They're backing the opposition.`)}n.demand=null}
/* political actions on campaign / consolidation turns */
function runPolAction(S,id,o){const n=S.nations[id],kind=polTurnKind(S,n);if(!kind)return;const c=POL_COST[o.kind]??0;
  const dem=["campaign","rally","attackOpp"],cons=["reward","purge","suppress"],str=["bribe","loyalists"];if(!(kind==="campaign"?dem:kind==="struggle"?str:cons).includes(o.kind))return;if(c&&!spend(S,id,c))return;
  if(o.kind==="bribe"){n.deposed.support=clamp(n.deposed.support+8,0,100);log(S,id,`You bribed officers. Your support: ${Math.round(n.deposed.support)}.`);return}
  if(o.kind==="loyalists"){n.deposed.support=clamp(n.deposed.support+3,0,100);log(S,id,`You rallied your loyalists. Your support: ${Math.round(n.deposed.support)}.`);return}
  if(o.kind==="campaign"){const r=S.regions[o.region]?.owner===id?o.region:n.capital;n.camp.regions[r]=(n.camp.regions[r]||0)+12;log(S,id,`Campaigned in ${REG[r].n}.`)}
  else if(o.kind==="rally"){const f=FAC.includes(o.faction)?o.faction:FAC[0];if(n.gov==="dem"&&!govMine(n)){addLean(n,f,14);log(S,id,`Rallied the ${FACN[f]} against the government.`)}else{appr(n,f,8);addLean(n,f,6);log(S,id,`Rallied the ${FACN[f]}.`)}}
  else if(o.kind==="attackOpp"){if(chance(0.25)){n.camp.nat-=4;log(S,id,"Your attack on the opposition backfired.")}else{n.camp.nat+=4;log(S,id,"Your attack on the opposition landed.")}}
  else if(o.kind==="reward"){n.loyalty=clamp(n.loyalty+12,0,100);log(S,id,`Rewarded ${n.gov==="dic"?"the generals":"the nobility"}. Loyalty rose.`)}
  else if(o.kind==="purge"){n.loyalty=clamp(n.loyalty+15,0,100);n.unrest=clamp(n.unrest+8,0,100);const w=FAC.reduce((a,f)=>n.fac[f].appr<n.fac[a].appr?f:a,FAC[0]);appr(n,w,-10);log(S,"all",`${NAT[id].name} carried out a purge.`)}
  else if(o.kind==="suppress"){const w=FAC.reduce((a,f)=>n.fac[f].appr<n.fac[a].appr?f:a,FAC[0]);facShift(n,w,-6);n.rep-=1;n.unrest=clamp(n.unrest+4,0,100);log(S,"all",`${NAT[id].name} cracked down on the ${FACN[w]}.`)}}
/* regional election */
function electionProjection(S,id){const n=S.nations[id],govA=govMine(n),affGov=n.govParty==="A"?1:-1,fatigue=Math.min(9,(n.govTerms||0)*3);const fac={};let base=0;
  for(const f of FAC){const g=clamp(50+affGov*FAC_AFF[f]+(n.fac[f].appr-50)*0.6+(govA?1:-1)*n.lean[f]-fatigue,5,95);fac[f]=Math.round(govA?g:100-g);base+=n.fac[f].size/100*g}
  const rows=[];let tot=0,wsum=0;
  for(const r of owned(S,id)){const g=S.regions[r];let v=base+g.infra*3+(r===n.capital?5:0)-(g.hit>=S.turn-4?3:0)-(g.taken>=S.turn-9?4:0)+(govA?1:-1)*((n.camp.regions[r]||0)+n.camp.nat);
    v=clamp(v,5,95);rows.push({r,v:Math.round(govA?v:100-v),pop:g.pop});tot+=g.pop*v;wsum+=g.pop}
  const govShare=wsum?tot/wsum:50;return{you:Math.round(govA?govShare:100-govShare),rows,fac,fatigue,govA}}
function runElection(S,id){const n=S.nations[id],P=electionProjection(S,id);let youWin=P.you>=50;const wasRigged=n.rigged;if(n.rigged){youWin=!youWin;n.rigged=false}
  n.lastElection={turn:S.turn,share:P.you,rows:P.rows,won:youWin};const was=n.govParty,mine=myParty(n);n.govParty=youWin?mine:other(mine);n.govTerms=(n.govParty===was)?(n.govTerms||0)+1:0;n.camp={regions:{},nat:0};
  const detail=[...P.rows].sort((a,b)=>b.pop-a.pop).slice(0,4).map(x=>`${REG[x.r].n} ${x.v}%`).join(", ");
  log(S,id,`Election: your ${PARTY[mine]} took ${P.you}% (${detail}).`);
  if(youWin){if(n.bloc)blocCredit(S,id,n.bloc.seats?.dip,2,"won the election");n.forced=0;n.oppBlock=false;log(S,"all",`${NAT[id].name}: the ${PARTY[mine]} ${was===mine?"held power":"returned to power"}.`)}
  else{n.forced=5;n.oppBlock=true;log(S,"all",`${NAT[id].name}: the ${PARTY[other(mine)]} won the election. It sets policy for 5 turns and can block one declaration of war.`);if(was===mine){reviewWars(S,id,"election",true);nukeReview(S,id,"The new government")}}
  if(wasRigged)log(S,id,"Foreign interference suspected in the election. The result doesn't match the polls.");
  if(youWin&&was!==mine)reviewWars(S,id,"back in power")}
/* events */
const EVENTS=[
  {id:"taxprotest",when:n=>n.tax>25,t:"Workers are protesting high taxes.",c:[["Cut taxes 5%",n=>{n.tax=Math.max(0,n.tax-5);appr(n,"work",6)}],["Spend 20 money to calm them",(n,S,id)=>{if(spend(S,id,20)){n.unrest=clamp(n.unrest-5,0,100);appr(n,"work",5)}else appr(n,"work",-10)},20],["Ignore them",n=>{appr(n,"work",-10);n.unrest=clamp(n.unrest+5,0,100)}]]},
  {id:"scandal",t:"A government scandal breaks.",c:[["Fire the ministers (15 money)",(n,S,id)=>{if(spend(S,id,15))appr(n,"ref",5);else appr(n,"ref",-8)},15],["Cover it up",n=>{if(chance(0.4)){appr(n,"ref",-15);n.unrest=clamp(n.unrest+10,0,100)}}],["Ride it out",n=>{for(const f of FAC)appr(n,f,-5)}]]},
  {id:"strike",when:n=>n.fac.work.appr<45,t:"A general strike shuts down factories.",c:[["Raise wages (20 money)",(n,S,id)=>{if(spend(S,id,20))appr(n,"work",10);else appr(n,"work",-15)},20],["Break the strike",n=>{appr(n,"work",-15);appr(n,"bus",5);n.unrest=clamp(n.unrest+6,0,100)}]]},
  {id:"parade",t:"Nationalists want a military parade.",c:[["Hold it (15 money)",(n,S,id)=>{if(spend(S,id,15)){appr(n,"nat",10);appr(n,"ref",-5)}},15],["Decline",n=>appr(n,"nat",-5)]]},
  {id:"corruption",when:n=>(n.budget.infra||0)>0,t:"Corruption allegations hit public works.",c:[["Investigate (15 money)",(n,S,id)=>{if(spend(S,id,15)){appr(n,"ref",8);appr(n,"bus",-5)}},15],["Ignore",n=>{appr(n,"ref",-8);n.unrest=clamp(n.unrest+4,0,100)}]]},
  {id:"boom",t:"An economic boom lifts the country.",auto:(n,S,id)=>{n.cash+=Math.round(income(S,id));appr(n,"bus",8)}},
  {id:"reform",t:"A reform movement is gathering pace.",auto:n=>{facShift(n,"ref",3);n.climPush.dem+=10}},
  {id:"rally",t:"A patriotic rally sweeps the country.",auto:n=>{appr(n,"nat",8);n.unrest=clamp(n.unrest-5,0,100)}},
  {id:"project",when:(n,S,id)=>owned(S,id).some(r=>S.regions[r].infra>0),t:"A popular public works project opens.",auto:n=>{appr(n,"bus",5);appr(n,"work",5)}},
  {id:"assassination",t:"A political assassination shocks the nation.",surprise:true,auto:n=>{appr(n,pick(FAC),-15);n.unrest=clamp(n.unrest+10,0,100)}}];
function fireEvent(S,id,surprise){const n=S.nations[id];const ok=e=>!e.when||e.when(n,S,id);const pool=EVENTS.filter(e=>(surprise?(e.surprise||e.auto):!e.surprise)&&ok(e));if(!pool.length)return;const e=pick(pool);
  if(e.auto){e.auto(n,S,id);log(S,id,`Event: ${e.t}`);return}
  if(n.human&&!outOfPower(n)){offer(S,id,id,"event",{ev:e.id});log(S,id,`Event: ${e.t} Decide on the Politics tab.`)}
  else if(n.human){const opts=e.c.map((c,i)=>i).filter(i=>!e.c[i][2]||n.cash>=e.c[i][2]);const i=opts.length?opts[0]:e.c.length-1;e.c[i][1](n,S,id);log(S,id,`Event: ${e.t} ${n.deposed?"The regime":"The governing party"} chose: ${e.c[i][0]}.`)}
  else{const opts=e.c.map((c,i)=>i).filter(i=>!e.c[i][2]||n.cash>=e.c[i][2]);const i=opts.length?opts[0]:e.c.length-1;e.c[i][1](n,S,id);log(S,id,`Event: ${e.t} ${e.c[i][0]}.`)}}
function applyEvent(S,o,choice){const e=EVENTS.find(x=>x.id===o.ev),n=S.nations[o.to];if(!e||!e.c)return;const i=clamp(choice|0,0,e.c.length-1);e.c[i][1](n,S,o.to);log(S,o.to,`${e.t} You chose: ${e.c[i][0]}.`)}
/* robots */
function botPolitics(S,id){const n=S.nations[id],O=[];const kind=polTurnKind(S,n);if(!kind)return O;
  if(kind==="campaign"){const rs=owned(S,id).sort((a,b)=>S.regions[b].pop-S.regions[a].pop);let cash=n.cash;
    for(const r of rs.slice(0,2))if(cash>=POL_COST.campaign+5){O.push({t:"pol",kind:"campaign",region:r});cash-=POL_COST.campaign}
    const w=FAC.reduce((a,f)=>n.fac[f].appr<n.fac[a].appr?f:a,FAC[0]);if(cash>=POL_COST.rally)O.push({t:"pol",kind:"rally",faction:w})}
  else{if(n.loyalty<55&&n.cash>=POL_COST.reward)O.push({t:"pol",kind:"reward"});if(n.loyalty<35)O.push({t:"pol",kind:"purge"});
    const w=FAC.reduce((a,f)=>n.fac[f].appr<n.fac[a].appr?f:a,FAC[0]);if(n.fac[w].appr<25&&n.fac[w].size>30)O.push({t:"pol",kind:"suppress"})}
  return O.slice(0,ACTION_CAP)}
function botMeetDemand(S,id){const n=S.nations[id],d=n.demand;if(!d||n.forced>0)return;const b=n.budget;
  if(d.k==="taxMax")n.tax=Math.min(n.tax,d.v);if(d.k==="infraMin"&&b.infra<d.v){b.troops=Math.max(0,b.troops-(d.v-b.infra));b.infra=d.v}
  if(d.k==="milMin"&&b.troops+b.def<d.v){const need=d.v-b.troops-b.def;b.troops+=need;b.res=Math.max(0,b.res-need)}if(d.k==="propMax")b.prop=Math.min(b.prop,d.v);
  const K=["troops","def","infra","prop"],s=K.reduce((a,k)=>a+b[k],0);if(s>100){for(const k of K)b[k]=Math.floor(b[k]*100/s)}b.res=100-K.reduce((a,k)=>a+b[k],0)}

/* ===== NUCLEAR PROGRAM (optional) ===== */
const NUKE_TURNS=8,NUKE_FUND=15,NUKE_MAX=3,NUKE_EVERY=5,NUKE_LEAK=0.04,WASTE_TURNS=5;
const nukes=S=>!!S.opts?.nukes;
const hasPublicBomb=(S,id)=>nukes(S)&&S.nations[id]?.nuke?.public&&S.nations[id].nuke.bombs>0;
function nk(n){if(!n.nuke)n.nuke={on:false,progress:0,done:false,public:false,bombs:0,lastBuild:0};return n.nuke}
function exposeProgram(S,id,how){const n=S.nations[id],N=nk(n);if(N.public)return;N.public=true;goesPublic(S,id);natBomb(S,id);
  log(S,"all",`${NAT[id].name}'s secret nuclear ${N.done?"arsenal":"program"} was exposed (${how}).`);
  for(const o of alive(S)){if(o===id)continue;const R=rel(S,id,o);if(!R||R.level===-2)continue;if(R.level===2){if(N.done)allyNukeReact(S,id,o);continue}if(R.trade){R.trade=false}S.nations[id].tradeBlock=S.turn+2;
    setLevel(S,id,o,Math.max(-1,R.level-1));if(rel(S,id,o).level===-1)addGriev(S,o,id)}
  log(S,"all",`Trade deals with ${NAT[id].name} were cancelled and its ambassadors summoned.`);sanctionPrompt(S,id)}
function announceBomb(S,id){const N=nk(S.nations[id]);if(N.public)return;N.public=true;goesPublic(S,id);natBomb(S,id);log(S,"all",`${NAT[id].name} tested a nuclear bomb. The world now knows it has the bomb.`);sanctionPrompt(S,id);
  for(const o of alive(S)){if(o===id)continue;if(allied(S,id,o)){allyNukeReact(S,id,o);continue}const R=rel(S,id,o);if(R&&R.level>-2)setLevel(S,id,o,Math.max(-1,R.level-1))}}
function nukeEconomy(S,id,inc){const n=S.nations[id],N=nk(n);if(!nukes(S)||N.done||!N.on)return inc;
  N.progress++;if(hasLaw(S,id,"grants")&&chance(0.5))N.progress++;if(!N.public&&chance(NUKE_LEAK))exposeProgram(S,id,"leak");
  if(N.progress>=NUKE_TURNS){N.done=true;N.on=false;N.bombs=1;N.lastBuild=S.turn;log(S,id,"Your nuclear program succeeded. You have a bomb.");
    if(!N.public){if(n.human)offer(S,id,id,"nukeDone");else if(chance(0.6))announceBomb(S,id)}}
  return inc*(100-NUKE_FUND)/100}
function nukeStockpile(S,id){const N=nk(S.nations[id]);if(N.done&&(N.bombs>=NUKE_MAX||N.build===false)){N.lastBuild=S.turn;return}if(N.done&&N.bombs<NUKE_MAX&&S.turn-N.lastBuild>=NUKE_EVERY){N.bombs++;N.lastBuild=S.turn;log(S,id,`Your stockpile grew to ${N.bombs} bomb${N.bombs>1?"s":""}.`)}}
const wasted=(S,r)=>(S.regions[r].waste||0)>S.turn;
function nukeStrike(S,id,r){const n=S.nations[id],N=nk(n),g=S.regions[r];if(!nukes(S)||N.bombs<=0||!g||wasted(S,r)||g.owner===id||S.turn<cf(S))return;
  const tw=g.owner;if(tw&&allied(S,id,tw))return;const vsRogue=tw&&isRogue(S,tw);if(!N.public){N.public=true;goesPublic(S,id);natBomb(S,id);if(!vsRogue)sanctionPrompt(S,id)}N.bombs--;
  if(tw&&!atWar(S,id,tw))declareWar(S,id,tw,"nuclear strike",true);
  if(tw)casualty(S,tw,g.troops+g.def);
  g.troops=0;g.def=0;g.guest=null;g.infra=0;g.pop=Math.max(1,Math.floor(g.pop*0.1));g.owner=null;g.waste=S.turn+WASTE_TURNS;
  if(tw){const tn=S.nations[tw];if(!tn.rogue)tn.unrest=clamp(tn.unrest+5,0,100);if(tn.capital===r){tn.capital=null}tn.lostThisTurn++;tn.termLosses++;tn.nukedBy=tn.nukedBy||{};tn.nukedBy[id]=(tn.nukedBy[id]||0)+33.3}
  log(S,"all",`☢ ${NAT[id].name} dropped a nuclear bomb on ${REG[r].n}. The region is a wasteland for ${WASTE_TURNS} turns.`);
  if(vsRogue){log(S,"all",`Nations condemned ${NAT[id].name}'s use of nuclear weapons against ${NAT[tw].name}.`);return}
  for(const o of alive(S)){if(o===id||o===tw)continue;const R=rel(S,id,o);if(!R||R.level===-2)continue;
    if(R.level===2){if(chance(0.5)){setLevel(S,id,o,-1);log(S,"all",`${NAT[o].name} broke its alliance with ${NAT[id].name} over the nuclear strike.`)}continue}

function tone(a,t,f1,f2,d,p,type="sine"){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(a,t,d,p,f,type="lowpass",f2){const b=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*d)),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);const g=a.createGain();g.gain.setValueAtTime(p,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t)}

function soundsFor(before,S2){const me=NAT[myNat]?.name||"",L=S2.log.filter(l=>l.t===before&&(l.to==="all"||l.to===myNat)).map(l=>l.text),has=re=>L.some(t=>re.test(t)),mine=re=>L.some(t=>re.test(t)&&t.includes(me)),q=[];
  if(S2.over){q.push(S2.winner?.includes(myNat)?"win":"lose")}
  else{const rules=[
    ["nukestrike",()=>L.some(t=>/dropped a nuclear bomb/.test(t)&&!t.startsWith("☢ "+me+" "))],
    ["war",()=>L.some(t=>new RegExp(`declared war on ${me}`).test(t))||L.some(t=>new RegExp(`captured .* from ${me}`).test(t))||has(/^You held /)],
    ["coup",()=>L.some(t=>new RegExp(`(Coup in|coup in|government of|leaders of) ${me}`).test(t))],
    ["nuketest",()=>L.some(t=>/tested a nuclear bomb/.test(t)&&!t.startsWith(me+" "))],
    ["elecwin",()=>L.some(t=>t.startsWith(me+":")&&/(held power|returned to power)/.test(t))],["eleclose",()=>L.some(t=>t.startsWith(me+":")&&/won the election/.test(t))],
    ["caught",()=>has(/(caught a spy|was caught trying)/)],["spyok",()=>has(/^(Intel stolen|Sabotage destroyed|Sabotage cost|Unrest is spreading|Next .* election will be rigged|Your agents sowed)/)],
    ["failed",()=>has(/^Battle for .* lost all/)],["event",()=>has(/^Event:/)]];
    for(const[k,f]of rules){try{if(f())q.push(k)}catch{}if(q.length>=3)break}if(!q.length)q.push("turn")}
  q.forEach((k,i)=>setTimeout(()=>play(k),i*1100))}

    case"missile":{const k=+$("#mslN").value,ex=myOrders.findIndex(o=>o.t==="missile"&&o.region===sel);if(ex>=0&&myOrders[ex].n===k){myOrders.splice(ex,1);saveDraft();render();break}addOrder({t:"missile",region:sel,n:k});break}
    case"sacrifice":{const t=$("#sacT")?.value,ex=myOrders.find(o=>o.t==="sacrifice");if(ex&&ex.after===id&&ex.target===t){myOrders=myOrders.filter(o=>o.t!=="sacrifice");saveDraft();render();break}if(t)addOrder({t:"sacrifice",target:t,after:id});break}
    case"nextTurn":endTurnSolo();break;
    case"milFund":addOrder({t:"milFund",b:id,on:el.dataset.v==="1"});break;
    case"milBuy":{const k=+$("#mb_"+id).value,ex=myOrders.find(o=>o.t==="milBuy"&&o.kind===id);if(ex&&ex.n===k){myOrders=myOrders.filter(o=>o!==ex);saveDraft();render();break}if(ex)myOrders=myOrders.filter(o=>o!==ex);if(S.nations[myNat].cash-spendQueued()<k*MIL_PRICE[id]){toast("Not enough in the treasury");render();break}addOrder({t:"milBuy",kind:id,n:k});break}
    case"airStrike":{const k=+$("#asN").value,ex=myOrders.find(o=>o.t==="airStrike"&&o.region===sel);if(ex&&ex.n===k){myOrders=myOrders.filter(o=>o!==ex);saveDraft();render();break}addOrder({t:"airStrike",region:sel,n:k});break}
    case"polNone":{const ex=myOrders.findIndex(o=>o.t==="pol"&&o.kind==="none");if(ex>=0){myOrders.splice(ex,1);saveDraft();render()}else addOrder({t:"pol",kind:"none"});break}
    case"polact":{myOrders=myOrders.filter(o=>!(o.t==="pol"&&o.kind==="none"));const k=el.dataset.k,o={t:"pol",kind:k};if(k==="campaign")o.region=$("#campR")?.value;if(k==="rally")o.faction=$("#rallyF")?.value;addOrder(o);break}
    case"confirmAtk":{const o=confirmAtk;confirmAtk=null;target=null;addOrder(o);break}
    case"cancelAtk":confirmAtk=null;render();break;
    case"a5":{const cur=myOrders.find(x=>x.t==="resp"&&x.id===+id);const o=cur&&cur.choice==="combo"?{...cur}:{t:"resp",id:+id,from:el.dataset.from,choice:"combo",war:false,basing:false,pct:0};const k=el.dataset.k;
      if(k==="pct"){const p=+el.dataset.pct;o.pct=o.pct===p?0:p}else o[k]=!o[k];myOrders=myOrders.filter(x=>!(x.t==="resp"&&x.id===+id));if(o.war||o.basing||o.pct)addOrder(o);else{saveDraft();render()}break}
    case"jwBase":case"jwFunds":{const cur=myOrders.find(x=>x.t==="resp"&&x.id===+id);const o=cur&&cur.choice==="support"?{...cur}:{t:"resp",id:+id,from:el.dataset.from,choice:"support",basing:false,pct:0};
      if(a==="jwBase")o.basing=!o.basing;else{const p=+el.dataset.pct;o.pct=o.pct===p?0:p}if(!o.basing&&!o.pct){myOrders=myOrders.filter(x=>!(x.t==="resp"&&x.id===+id));saveDraft();render();break}addOrder(o);break}
    case"evresp":addOrder({t:"resp",id:+id,from:myNat,choice:"event",idx:+el.dataset.i});break;
    case"quitAsk":quitAsk=true;render();break;
    case"quitCancel":quitAsk=false;render();break;
    case"quitSave":quitAsk=false;if(unsub){unsub();unsub=null}chatStop();mode=null;lobby=null;S=null;results=null;screen="home";render();break;
    case"quitDelete":quitAsk=false;lsSet("sov-solo",null);lsSet("sov-draft",null);mode=null;S=null;results=null;screen="home";render();break;
    case"party":{myOrders=myOrders.filter(o=>o.t!=="party");myOrders.push({t:"party",p:id});saveDraft();render();break}
    case"rename":{const nm=($("#allyNm")?.value||"").trim();myOrders=myOrders.filter(o=>o.t!=="renameAlliance");if(nm)addOrder({t:"renameAlliance",name:nm});else{saveDraft();render()}break}
    case"closeIntro":introOpen=false;render();break;
    case"closeResults":results=null;render();try{window.scrollTo(0,0)}catch{}break;
    case"mute":sndOpen=true;render();break;
    case"chatOpen":chat.open=true;markSeen();render();setTimeout(()=>$("#chatIn")?.focus(),50);break;
    case"chatClose":chat.open=false;render();break;
    case"chatSend":chatSend();break;
    case"vJoin":voiceJoin();break;
    case"vLeave":voiceLeave();break;
    case"vMute":V.muted=!V.muted;V.stream?.getTracks().forEach(t=>t.enabled=!V.muted);render();break;
    case"sndClose":sndOpen=false;render();break;
    case"sndMaster":muted=!muted;lsSet("sov-mute",muted?"1":null);if(!muted)play("turn");render();break;
    case"sndPlay":{const m=muted,o=sndOff[id];muted=false;sndOff[id]=false;play(id);muted=m;sndOff[id]=o;break}
    case"sndToggle":sndOff[id]=!sndOff[id];lsSet("sov-sndoff",JSON.stringify(sndOff));if(!sndOff[id])play(id);render();break;
    case"focus":addOrder({t:"focus",region:sel});break;
    case"capital":addOrder({t:"capital",region:sel});break;
    case"rmOrder":myOrders.splice(+el.dataset.i,1);saveDraft();render();break;
    case"resp":{const ch=el.dataset.v,o={t:"resp",id:+id,from:el.dataset.from,choice:ch};if(el.dataset.air)o.air=true;if(el.dataset.i!=null)o.idx=+el.dataset.i;if(ch==="strike")o.region=$("#thrR-"+id)?.value;if(ch==="counter")Object.assign(o,parseTerms($("#ctr-"+id)?.value));if(ch==="peace")Object.assign(o,parseTerms($("#gr-"+id)?.value));if(ch==="funds")o.pct=+el.dataset.pct;addOrder(o);break}
    case"gift":{const amt=+($("#gift-"+id)?.value||0),ex=myOrders.findIndex(x=>x.t==="dip"&&x.kind==="gift"&&x.target===id);if(!amt||(ex>=0&&myOrders[ex].amount===amt)){if(ex>=0)myOrders.splice(ex,1);saveDraft();render();break}
      if(S.nations[myNat].cash-spendQueued()+(ex>=0?myOrders[ex].amount:0)<amt){toast("Not enough in the treasury");break}if(ex>=0)myOrders.splice(ex,1);addOrder({t:"dip",kind:"gift",target:id,amount:amt});break}
    case"dip":{const k=el.dataset.k;const ex=myOrders.findIndex(x=>x.t==="dip"&&x.target===id&&x.kind===k);if(ex>=0){myOrders.splice(ex,1);saveDraft();render();break}
      const o={t:"dip",kind:k,target:id};
      if(k==="peace")Object.assign(o,parseTerms($("#terms-"+id)?.value));
      if(k==="tribute"){const v=$("#trib-"+id)?.value||"20";if(v.startsWith("r:"))o.region=v.slice(2);else o.pct=+v}
      if((k==="tribute"||k==="nukeStop")&&$("#thr-"+id)?.checked)o.threat=true;addOrder(o);break}
    case"spyDistrust":{const gid=+$("#spyA").value,g=(S.alliances||[]).find(k=>k.id===gid);if(!g)break;addOrder({t:"spy",mission:"distrust",alliance:gid,target:g.members.find(m=>S.nations[m]?.alive)});break}
    case"spy":{const t=$("#spyT").value,m=$("#spyM").value,n0=myOrders.length;addOrder({t:"spy",target:t,mission:m});if(myOrders.length>n0)toast("Spy dispatched when the turn ends");break}
    case"savePol":{const b={};for(const k of ["troops","def","infra","prop"])b[k]=+$("#b-"+k).value;const tot=Object.values(b).reduce((a,x)=>a+x,0);if(tot>100){toast("Allocations can't exceed 100%");break}b.res=100-tot;polDraft=null;addOrder({t:"policy",tax:+$("#tax").value,budget:b});toast("Policy set for this term");break}
    case"recruit":{const k=+$("#rec").value;if(S.nations[myNat].cash-spendQueued()<k*tCost(S,myNat)){toast("Not enough in the treasury");break}myOrders=myOrders.filter(x=>x.t!=="recruit");addOrder({t:"recruit",n:k,region:$("#recR").value});break}
    case"endTurn":document.activeElement?.blur?.();actx();{const bl=endBlockers();if(bl.length){toast(bl[0]);armEnd=false;break}}
      if(!armEnd){armEnd=true;clearTimeout(armT);armT=setTimeout(()=>{armEnd=false;render()},3000);render();break}
      armEnd=false;clearTimeout(armT);if(mode==="solo")endTurnSolo();else submitOrders();break}});

/* ---------- boot ---------- */
app.addEventListener("change",e=>{const el=e.target;
  if(el.id==="wnIn"){setup.opts={...setup.opts,big:true,grande:false,wn:clampWn(el.value)};if(setup.nat&&!natsForO(setup.opts).includes(setup.nat))setup.nat=null;if((setup.robots||4)>robotMax())setup.robots=robotMax();render()}
  if(el.id==="rbIn"){setup.robots=+el.value;render()}});
(async()=>{render();
  if(firebaseConfig.apiKey){try{const fa=initializeApp(firebaseConfig),auth=getAuth(fa);await signInAnonymously(auth);me=auth.currentUser.uid;db=makeDb(getFirestore(fa))}catch{toast("Online play unavailable right now")}}
  const inv=new URLSearchParams(location.search).get("g");if(inv&&db){history.replaceState(null,"",location.pathname);setup={nat:null,diff:"normal",opts:{}};joinLobby(inv)}else render()})();

</script>
</body>
