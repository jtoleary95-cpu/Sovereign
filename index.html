<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sovereign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#DCE2E5;--panel:#EDF0F2;--ink:#172230;--soft:#586777;--line:#B3BFC8;--act:#274F6E;--war:#B3332B;--ally:#2E7D5B;--hot:#B3332B;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171E;--panel:#18232D;--ink:#DCE4EA;--soft:#8FA0AE;--line:#2C3B48;--act:#6FA3C9;--war:#E0574B;--ally:#4FB386;--hot:#E0574B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171E;--panel:#18232D;--ink:#DCE4EA;--soft:#8FA0AE;--line:#2C3B48;--act:#6FA3C9;--war:#E0574B;--ally:#4FB386;--hot:#E0574B;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Source Sans 3",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:10px 12px 96px}
h1,h2,h3,h4{font-family:"Archivo Narrow","Arial Narrow",sans-serif;font-weight:700;margin:14px 0 6px;line-height:1.15}
h1{font-size:3rem;letter-spacing:.01em;margin:28px 0 4px}h2{font-size:1.35rem;margin:0}h3{font-size:1.15rem}h4{font-size:.95rem;color:var(--soft);margin:12px 0 2px}
p{margin:.35em 0}.muted{color:var(--soft)}.note{color:var(--soft);font-size:.9rem}.small{font-size:.9rem}
.lede{font-size:1.1rem;color:var(--soft);max-width:30ch}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--act);border-color:var(--act);color:#fff}.btn.small{padding:5px 10px;min-height:34px;font-size:.9rem}.btn.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}.wide{width:100%;margin-top:12px}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px;margin:18px 0}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row.wrap{flex-wrap:wrap}.row input[type=range]{flex:1}
input.code{flex:1;font:700 1.5rem "Archivo Narrow",sans-serif;letter-spacing:.25em;text-transform:uppercase;padding:8px 12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0}
select{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-height:34px}
label{display:block;margin:10px 0 2px;font-weight:600}label select,label input[type=range]{display:block;width:100%;margin-top:4px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nat{text-align:left;border:1.5px solid var(--line);border-left:6px solid var(--nc);background:var(--panel);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.nat b{font-family:"Archivo Narrow",sans-serif;font-size:1.1rem}.nat span{font-size:.82rem;color:var(--soft)}.nat.on{border-color:var(--nc);box-shadow:inset 0 0 0 2px var(--nc)}.nat:disabled{opacity:.35}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:8px;font-weight:600}.seg button.on{background:var(--ink);color:var(--bg)}
.codebox{background:var(--panel);border-left:4px solid var(--act);padding:10px 12px;margin:8px 0 12px}.codebox b{font:700 2rem "Archivo Narrow",sans-serif;letter-spacing:.2em}
.order{padding-left:1.2em}.order li{margin:4px 0;border-left:4px solid var(--nc);padding-left:8px;list-style-position:outside}
.gbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--nc);padding:6px 0 8px;margin:0 0 8px;top:env(safe-area-inset-top,0px)}
.who{display:flex;align-items:center;gap:8px;font-family:"Archivo Narrow",sans-serif;font-size:1.2rem}.chip{width:14px;height:14px;border-radius:3px;background:var(--nc)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem;color:var(--soft)}.stats b{color:var(--ink)}.hot b,.hot{color:var(--hot)}
.tag{font-style:normal;background:var(--act);color:#fff;border-radius:4px;padding:0 6px;font-size:.8rem}
.tabs{display:flex;gap:2px;margin:6px 0 8px;overflow-x:auto}.tabs button{flex:1 0 auto;border:0;border-bottom:3px solid transparent;background:transparent;padding:8px 6px;font-weight:600;color:var(--soft);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.map{width:100%;display:block;touch-action:manipulation}
.map .ln line,.map .ln path{stroke:var(--line);stroke-width:2}.map .ln.sea line{stroke-dasharray:5 4}
.tile rect{fill:var(--panel);stroke:var(--line);stroke-width:1}.tile.owned rect{stroke:none}
.tile text{text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tile .rn{font:600 10.5px "Source Sans 3",sans-serif;fill:var(--ink)}.tile .tc{font:700 16px "Archivo Narrow",sans-serif;fill:var(--ink)}.tile .def{font-size:11px}
.tile.owned .rn,.tile.owned .tc{fill:#fff}
.tile.war rect{stroke:var(--war);stroke-width:3}.tile.ally rect{stroke:var(--ally);stroke-width:3;stroke-dasharray:4 3}
.tile.adj rect{stroke:var(--ink);stroke-width:2.5}.tile.sel rect{stroke:var(--ink);stroke-width:4}.tile{cursor:pointer}.tile:focus{outline:none}.tile:focus-visible rect{stroke:var(--act);stroke-width:4}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--soft)}.legend .lw{color:var(--war)}
.caps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;margin-bottom:4px}.cap{border-left:5px solid var(--nc);padding:0 6px;background:var(--panel);border-radius:3px}
.panel{background:var(--panel);border-radius:8px;padding:10px 12px;margin:10px 0}.panel h3{margin-top:0}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem;color:var(--soft)}.kv b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chipbtn{border:1.5px solid var(--ink);background:transparent;border-radius:16px;padding:5px 11px;font-size:.9rem;font-weight:600}.chipbtn.on{background:var(--ink);color:var(--bg)}.chipbtn:disabled{opacity:.35}
.notice{border-left:4px solid var(--act);background:var(--panel);padding:8px 10px;margin:8px 0;font-size:.95rem;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.goal{font-weight:600;margin:4px 0}.alloc{font:600 .9rem "Source Sans 3",sans-serif;color:var(--soft);margin-left:8px}.alloc b{color:var(--ink)}.alloc.hot b{color:var(--hot)}
.mute{position:absolute;right:0;top:4px;border:0;background:transparent;font-size:1.2rem;min-width:40px;min-height:40px}.gbar{position:sticky}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet .inner{background:var(--bg);width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.warn{border-left:4px solid var(--war);background:var(--panel);padding:8px 10px;margin:8px 0;font-size:.95rem}
.offer,.ncard{background:var(--panel);border-left:5px solid var(--nc);border-radius:0 8px 8px 0;padding:8px 10px;margin:8px 0}.ncard.dead{opacity:.5}
.nhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.nhead b{font-family:"Archivo Narrow",sans-serif;font-size:1.1rem}
.rel{font-size:.85rem;font-weight:600;margin-left:auto}.rel.r-2{color:var(--war)}.rel.r-1{color:#C0712B}.rel.r1{color:var(--ally)}.rel.r2{color:var(--ally)}
.orders{margin-top:14px}.ord{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:.95rem}
.x{border:0;background:transparent;font-size:1.1rem;min-width:36px;min-height:36px;color:var(--soft)}
.endbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.endbar .btn{flex:1;max-width:500px}.endbar .btn.armed{background:var(--war);border-color:var(--war)}.timer{font:700 1.3rem "Archivo Narrow",sans-serif;min-width:48px;text-align:center}.timer.hot{color:var(--hot)}
.logl{font-size:.93rem;margin:3px 0}.logl.mine{font-weight:600}
.over{text-align:center;background:var(--panel);border-radius:8px;padding:14px;margin:8px 0}.banner{font:700 2.6rem "Archivo Narrow",sans-serif}.over.won .banner{color:var(--ally)}
.rules{margin:18px 0}.rules summary{font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;max-width:90vw;z-index:20;transition:opacity .2s}
.toast[hidden]{display:block;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc as fdoc, getDoc, setDoc, updateDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== FIREBASE CONFIG (same project as Deep Salvo) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBcsUoFs2p9MBd_ZA5QdCznjmhYimHGmw0",
  authDomain: "battle-ship-7f0d9.firebaseapp.com",
  projectId: "battle-ship-7f0d9",
  storageBucket: "battle-ship-7f0d9.firebasestorage.app",
  messagingSenderId: "622001257172",
  appId: "1:622001257172:web:841fb2a3f10a8d5ce11941"
};
function wrap(s){return{exists:s.exists(),data:()=>s.data(),metadata:s.metadata}}
function makeDb(fs){return{doc(p){const r=fdoc(fs,p);return{get:async()=>wrap(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),onSnapshot:(n,e)=>onSnapshot(r,s=>n(wrap(s)),e)}}}}
/* ===== ENGINE: pure game rules ===== */
const REG={
  GRL:{n:"Greenland",c:0,r:0,pop:25}, USA:{n:"USA",c:0,r:1,pop:260}, CAM:{n:"C. America",c:0,r:2,pop:90}, AND:{n:"Andes",c:0,r:3,pop:90}, ARG:{n:"Argentina",c:0,r:4,pop:70},
  UK:{n:"UK",c:1,r:0,pop:110}, WEU:{n:"W. Europe",c:1,r:1,pop:200}, WAF:{n:"W. Africa",c:1,r:2,pop:130}, BRA:{n:"Brazil",c:1,r:3,pop:170},
  RUS:{n:"Russia",c:2,r:0,pop:200}, EEU:{n:"E. Europe",c:2,r:1,pop:130}, MEA:{n:"Mid East",c:2,r:2,pop:130}, EGY:{n:"Egypt",c:2,r:3,pop:110}, SAF:{n:"S. Africa",c:2,r:4,pop:90},
  SIB:{n:"Siberia",c:3,r:0,pop:70}, CHN:{n:"China",c:3,r:1,pop:240}, IND:{n:"India",c:3,r:2,pop:260}, SEA:{n:"SE Asia",c:3,r:3,pop:170},
  JAP:{n:"Japan",c:4,r:0.5,pop:130}, AUS:{n:"Australia",c:4,r:4,pop:70}
};
const LAND=[["USA","CAM"],["CAM","AND"],["AND","ARG"],["AND","BRA"],["BRA","ARG"],["WEU","EEU"],["EEU","RUS"],["EEU","MEA"],["WEU","WAF"],["WAF","EGY"],["WAF","SAF"],["EGY","MEA"],["EGY","SAF"],["RUS","SIB"],["SIB","CHN"],["CHN","IND"],["IND","SEA"],["MEA","IND"],["CHN","SEA"]];
const SEA=[["GRL","USA"],["GRL","UK"],["UK","WEU"],["BRA","WAF"],["JAP","SIB"],["JAP","CHN"],["SEA","AUS"]];
const ADJ={};for(const k in REG)ADJ[k]=[];for(const[a,b]of[...LAND,...SEA]){ADJ[a].push(b);ADJ[b].push(a)}
const NAT={
  USA:{name:"USA",home:"USA",tier:"strong",gov:"dem",color:"#1F5FBF"},
  CHN:{name:"China",home:"CHN",tier:"strong",gov:"dic",color:"#C62828"},
  RUS:{name:"Russia",home:"RUS",tier:"strong",gov:"dic",color:"#6A1B9A"},
  IND:{name:"India",home:"IND",tier:"mid",gov:"dem",color:"#EF6C00"},
  JAP:{name:"Japan",home:"JAP",tier:"mid",gov:"mon",color:"#E0457B"},
  UK:{name:"UK",home:"UK",tier:"mid",gov:"mon",color:"#00838F"},
  BRA:{name:"Brazil",home:"BRA",tier:"weak",gov:"dem",color:"#6FA82F"},
  EGY:{name:"Egypt",home:"EGY",tier:"weak",gov:"dic",color:"#7B5B3A"}
};
const HOMES=Object.values(NAT).map(x=>x.home);
const TIER={strong:{cash:60,troops:30},mid:{cash:45,troops:22},weak:{cash:30,troops:15}};
const GOVN={dem:"Democracy",mon:"Monarchy",dic:"Dictatorship"};
const RELN={"-2":"War","-1":"Negative","0":"Neutral","1":"Positive","2":"Alliance"};
const COST={troop:2,def:3,spy:8,infra:25,capital:20};
const NEUTRAL_DEF=8,NEUTRAL_CAP_DEF=12,CEASEFIRE=4,STALE_TURN=25,ACTION_CAP=3,SPY_CAP=2;
const ACTIONS=["move","attack","spy","airlift"];const actW=o=>o.t==="airlift"?ACTION_CAP:1;
const MISSIONS={intel:"Steal intel",sabotage:"Sabotage troops",economy:"Sabotage economy",unrest:"Stir unrest",rig:"Rig election"};
const PERS=["warlord","merchant","schemer","turtle"];
const BUDGET_PRESET={warlord:{troops:55,def:10,infra:10,prop:10,res:15},merchant:{troops:30,def:10,infra:30,prop:10,res:20},schemer:{troops:35,def:10,infra:10,prop:10,res:35},turtle:{troops:30,def:35,infra:15,prop:10,res:10}};
const FORCED={tax:15,budget:{troops:15,def:20,infra:25,prop:25,res:15}};

const rnd=n=>Math.floor(Math.random()*n);
const chance=p=>Math.random()<p;
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pk=(a,b)=>a<b?a+"|"+b:b+"|"+a;
const rel=(S,a,b)=>S.rel[pk(a,b)];
const owned=(S,id)=>Object.keys(S.regions).filter(r=>S.regions[r].owner===id);
const alive=S=>Object.keys(S.nations).filter(n=>S.nations[n].alive);
const strength=(S,id)=>owned(S,id).reduce((t,r)=>t+S.regions[r].troops+S.regions[r].def,0)+Object.values(S.regions).reduce((t,g)=>t+(g.guest?.nat===id?g.guest.n:0),0);
const allied=(S,a,b)=>a!==b&&rel(S,a,b)?.level===2;
const allyOf=(S,a)=>alive(S).find(b=>allied(S,a,b))||null;
const atWar=(S,a,b)=>rel(S,a,b)?.level===-2;
const log=(S,to,text)=>S.log.push({t:S.turn,to,text});
const isPolicyTurn=S=>S.turn%5===1;
const maxTax=n=>n.gov==="dic"?70:50;
function leader(S){let best=null,bc=-1;for(const n of alive(S)){const c=owned(S,n).length;if(c>bc){bc=c;best=n}}return best}

/* seats: [{nat, human:uid|null, diff, pers}]  picks: {nat: regionId} */
function newState(seats,picks){
  const S={turn:1,regions:{},nations:{},rel:{},offers:[],log:[],hold:{},winner:null,over:false,nextOffer:1,caps:seats.map(s=>NAT[s.nat].home)};
  for(const k in REG)S.regions[k]={owner:null,troops:HOMES.includes(k)?NEUTRAL_CAP_DEF:NEUTRAL_DEF,def:0,pop:REG[k].pop,infra:0};
  for(const s of seats){const N=NAT[s.nat],T=TIER[N.tier];
    S.nations[s.nat]={id:s.nat,human:s.human||null,diff:s.diff||"normal",pers:s.pers||pick(PERS),gov:N.gov,tax:25,budget:{troops:40,def:15,infra:15,prop:10,res:20},
      cash:T.cash,unrest:20,support:{dem:0,mon:0,dic:0},maxTurns:0,forced:0,capital:N.home,lostSince:null,alive:true,intel:{},rigged:false,
      termWins:0,termLosses:0,propTerm:0,infraFund:0,defFocus:null,rep:0,homeRegions:[N.home,picks[s.nat]].filter(Boolean),lostThisTurn:0,capAttacked:false};
    const home=S.regions[N.home];home.owner=s.nat;home.troops=Math.ceil(T.troops*0.65);
    const p=picks[s.nat];if(p){const r=S.regions[p];r.owner=s.nat;r.troops=T.troops-home.troops}}
  const ids=Object.keys(S.nations);
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)S.rel[pk(ids[i],ids[j])]={level:0,prog:0,quiet:0,truce:0,trade:false,allySince:null};
  for(const id of ids)if(!S.nations[id].human)botPolicy(S,id);
  log(S,"all",`Ceasefire: nations cannot attack each other before turn ${CEASEFIRE}. Neutral regions are fair game from turn 1.`);
  return S}

function pickChoices(taken,nat){return ADJ[NAT[nat].home].filter(r=>!HOMES.includes(r)&&!taken.includes(r))}

/* visibility for a nation */
function visible(S,me){const v=new Set(),full=new Set();const n=S.nations[me];if(!n)return{v,full};
  for(const r of owned(S,me)){v.add(r);for(const a of ADJ[r])v.add(a)}
  for(const o of alive(S))if(o!==me&&(allied(S,me,o)||(n.intel[o]||0)>=S.turn)){full.add(o);for(const r of owned(S,o))v.add(r)}
  return{v,full}}

function income(S,id){const n=S.nations[id];let inc=0;
  for(const r of owned(S,id)){const g=S.regions[r];inc+=g.pop*n.tax/100*0.1*(1+0.15*g.infra)}
  let trade=0;if(!(n.tradeBlock>S.turn))for(const o of alive(S))if(o!==id&&rel(S,id,o)?.trade)trade+=n.gov==="dem"?0.15:0.10;for(const o of alive(S))if(allied(S,id,o))trade+=0.05;
  inc*=1+trade;if(n.unrest>50)inc*=1-(n.unrest-50)/100;return Math.max(0,inc)}

function dice(k){return Array.from({length:k},()=>1+rnd(6)).sort((a,b)=>b-a)}
function battle(att,def,bonus){while(att>0&&def>0){const A=dice(Math.min(3,att)),D=dice(Math.min(2,def));if(bonus)D[0]+=1;for(let i=0;i<Math.min(A.length,D.length);i++){if(A[i]>D[i])def--;else att--}}return{att,def}}

function winChance(att,def,bonus,n=400){let w=0;for(let i=0;i<n;i++)if(battle(att,def,bonus).def<=0)w++;return w/n}
function setLevel(S,a,b,l){const R=rel(S,a,b);if(!R)return;const was=R.level;R.level=l;R.prog=0;R.quiet=0;if(l<0)R.trade=false;if(l!==2)R.allySince=null;if(l===2&&was!==2)R.allySince=S.turn;
  if(was===2&&l!==2){R.base={};for(const k in S.regions){const g=S.regions[k];if(g.guest&&((g.owner===a&&g.guest.nat===b)||(g.owner===b&&g.guest.nat===a))){const home=S.nations[g.guest.nat].capital;if(home&&S.regions[home].owner===g.guest.nat)S.regions[home].troops+=g.guest.n;g.guest=null}}}}
const basing=(S,host,guest)=>allied(S,host,guest)&&!!rel(S,host,guest)?.base?.[host];
const dropRel=(S,a,b,k)=>{const R=rel(S,a,b);if(R&&R.level>-2&&R.level<2)setLevel(S,a,b,Math.max(-1,R.level-k))};
const MISSION_VERB={intel:"steal state secrets",sabotage:"sabotage troops",economy:"sabotage the economy",unrest:"stir up unrest",rig:"rig an election"};
const hasGrievance=(S,a,b)=>{const t=rel(S,a,b)?.griev?.[a];return t!=null&&S.turn-t<=3};
function addGriev(S,a,b){const R=rel(S,a,b);if(!R)return;R.griev=R.griev||{};R.griev[a]=S.turn}
const canAlly=R=>R&&(R.level===1||(R.level===0&&R.trade));
const canDeclare=(S,a,b)=>{const R=rel(S,a,b);return !!R&&R.level!==-2&&R.level!==2&&R.truce<=0&&S.turn>=CEASEFIRE};
function summon(S,a,b,why){const R=rel(S,a,b);if(!R||R.level===-2||R.level===2)return;addGriev(S,a,b);S.nations[b].tradeBlock=S.turn+2;if(R.level>-1)setLevel(S,a,b,R.level-1);
  log(S,"all",`${NAT[a].name} summoned ${NAT[b].name}'s ambassador${why?" over "+why:""}. ${NAT[b].name} loses its trade income for 2 turns.`)}
function declareWar(S,a,b,why,force){const R=rel(S,a,b);if(!R||R.level===-2)return false;if(!force&&!canDeclare(S,a,b))return false;
  const unprovoked=!force&&!hasGrievance(S,a,b);
  if(R.level>=0)S.nations[a].rep-=1;if(R.level===2)S.nations[a].rep-=1;setLevel(S,a,b,-2);R.truce=0;R.aggressor=a;
  log(S,"all",`${NAT[a].name} declared war on ${NAT[b].name}${why?" ("+why+")":unprovoked?", unprovoked":""}.`);
  if(unprovoked){S.nations[a].rep-=2;const hit=[];for(const c of alive(S)){if(c===a||c===b||allied(S,a,c))continue;const Rc=rel(S,a,c);if(Rc&&Rc.level>-1){setLevel(S,a,c,Rc.level-1);hit.push(NAT[c].name)}}
    if(hit.length)log(S,"all",`The unprovoked attack turned opinion against ${NAT[a].name}: relations fell with ${hit.join(", ")}.`)}
  // common enemy: nations already fighting the same foe warm to each other
  for(const c of alive(S)){if(c===a||c===b)continue;
    if(atWar(S,c,b)){const Rc=rel(S,a,c);if(Rc&&Rc.level>=-1&&Rc.level<1){setLevel(S,a,c,Rc.level+1);log(S,"all",`${NAT[a].name} and ${NAT[c].name} now share an enemy in ${NAT[b].name}. Relations improved.`)}}
    if(atWar(S,c,a)){const Rc=rel(S,b,c);if(Rc&&Rc.level>=-1&&Rc.level<1){setLevel(S,b,c,Rc.level+1);log(S,"all",`${NAT[b].name} and ${NAT[c].name} now share an enemy in ${NAT[a].name}. Relations improved.`)}}}
  const defAlly=allyOf(S,b);if(defAlly&&defAlly!==a&&!atWar(S,defAlly,a)){addGriev(S,defAlly,a);log(S,"all",`${NAT[b].name} invoked Article 5. Its ally ${NAT[defAlly].name} must respond to ${NAT[a].name}'s attack.`);
    if(S.nations[defAlly].human)offer(S,b,defAlly,"article5",{attacker:a});else botArticle5(S,defAlly,b,a)}
  // the aggressor's ally is asked, not obliged
  const offAlly=allyOf(S,a);if(offAlly&&offAlly!==b&&!atWar(S,offAlly,b)){
    if(S.nations[offAlly].human){offer(S,a,offAlly,"joinWar",{target:b});log(S,offAlly,`Your ally ${NAT[a].name} went to war with ${NAT[b].name}. Will you join?`)}
    else{const Rb=rel(S,offAlly,b);if(Rb.level<=0&&chance(0.6))declareWar(S,offAlly,b,"joining its ally "+NAT[a].name,true);else log(S,a,`${NAT[offAlly].name} chose not to join your war.`)}}
  return true}
function article5(S,ally,victim,attacker,choice,pct){const na=NAT[ally].name;
  if(choice==="war"){declareWar(S,ally,attacker,"Article 5, defending "+NAT[victim].name,true)}
  else if(choice==="basing"){const R=rel(S,ally,victim);if(R){R.base=R.base||{};R.base[ally]=true}dropRel(S,ally,attacker,2);log(S,"all",`${na} opened its territory to ${NAT[victim].name}'s troops. Relations with ${NAT[attacker].name} fell sharply.`)}
  else if(choice==="funds"){const p=pct||10,amt=payPct(S,ally,victim,p);dropRel(S,ally,attacker,1);log(S,"all",`${na} sent ${amt} in war funds to ${NAT[victim].name}. Relations with ${NAT[attacker].name} cooled.`)}
  else{setLevel(S,ally,victim,-1);log(S,"all",`${na} ignored Article 5. Its alliance with ${NAT[victim].name} is over.`)}}
function botArticle5(S,ally,victim,attacker){const ms=strength(S,ally),as=strength(S,attacker);const c=ms>as*0.8&&chance(0.6)?"war":chance(0.5)?"funds":chance(0.7)?"basing":"nothing";article5(S,ally,victim,attacker,c,10)}
function reviewWars(S,id,why){const n=S.nations[id];for(const e of alive(S)){if(e===id||!atWar(S,id,e))continue;const R=rel(S,id,e),aggr=R.aggressor===id;
    if(n.human){offer(S,e,id,"govReview",{why});continue}
    n.peaceMood=S.turn+4;if(!chance(aggr?0.75:0.45)){log(S,"all",`${NAT[id].name}'s new government will keep fighting ${NAT[e].name}.`);continue}
    let t={terms:"none"};if(aggr){const mine=owned(S,id).filter(r=>r!==n.capital).sort((x,y)=>S.regions[x].pop-S.regions[y].pop);t=chance(0.5)||!mine.length?{terms:"payTribute",pct:pick([10,20])}:{terms:"giveRegion",region:mine[0]}}
    log(S,"all",`${NAT[id].name}'s new government is seeking peace with ${NAT[e].name}.`);const o=offer(S,id,e,"peace",t);
    if(!S.nations[e].human){const yes=botRespond(S,o);applyOffer(S,o,yes,yes?null:botCounter(S,o));S.offers=S.offers.filter(x=>x.id!==o.id)}}}
function spend(S,id,amt){const n=S.nations[id];if(n.cash<amt)return false;n.cash-=amt;return true}

function regionCaptured(S,r,newOwner){const g=S.regions[r],old=g.owner;g.def=0;g.owner=newOwner;
  if(old){const on=S.nations[old];on.lostThisTurn++;on.termLosses++;
    if(on.capital===r){on.capital=null;on.lostSince=S.turn;log(S,old,`Your capital ${REG[r].n} has fallen. Choose a new capital. You have 5 turns to retake ${REG[NAT[old].home].n}.`)}}
  if(newOwner){const nn=S.nations[newOwner];nn.termWins++;nn.unrest=clamp(nn.unrest+2,0,100);
    const move=Math.floor(g.pop*0.2);let left=move;
    for(const o of owned(S,newOwner)){if(o===r||left<=0)continue;const og=S.regions[o],cap=Math.round(REG[o].pop*(1+0.2*og.infra)),room=cap-og.pop;if(room>0){const m=Math.min(room,left);og.pop+=m;left-=m}}
    g.pop-=move-left;
    if(r===NAT[newOwner].home&&nn.capital!==r){nn.capital=r;nn.lostSince=null;log(S,newOwner,`You retook your home capital ${REG[r].n}.`)}}}

function eliminate(S,id,why){const n=S.nations[id];if(!n.alive)return;n.alive=false;for(const r of owned(S,id)){S.regions[r].owner=null;S.regions[r].def=0}
  S.offers=S.offers.filter(o=>o.from!==id&&o.to!==id);log(S,"all",`${NAT[id].name} has been eliminated${why?" ("+why+")":""}.`)}

function breakAway(S,id,why){const cands=owned(S,id).filter(r=>r!==S.nations[id].capital);if(!cands.length)return;const r=pick(cands);S.regions[r].owner=null;S.regions[r].def=0;
  log(S,"all",`${REG[r].n} broke away from ${NAT[id].name} (${why}).`)}

function changeGov(S,id,to,why){const n=S.nations[id];if(n.gov===to)return;n.gov=to;n.forced=0;n.tax=Math.min(n.tax,maxTax(n));log(S,"all",`${NAT[id].name} is now a ${GOVN[to]} (${why}).`);reviewWars(S,id,why)}

function spyCaught(S,from,to,mission){const R=rel(S,from,to),verb=MISSION_VERB[mission]||"spy";
  log(S,to,`You caught a spy from ${NAT[from].name} trying to ${verb}.`);log(S,from,`Your spy in ${NAT[to].name} was caught trying to ${verb}.`);
  if(!R||R.level===-2)return;addGriev(S,to,from);
  if(R.level===2){if(chance(0.5)){setLevel(S,from,to,-1);log(S,"all",`The ${NAT[from].name}–${NAT[to].name} alliance collapsed over a spy scandal.`)}else log(S,"all",`The ${NAT[from].name}–${NAT[to].name} alliance survived a spy scandal.`);return}
  if(R.level===1){summon(S,to,from,"a spy scandal");return}
  if(S.nations[to].human){offer(S,from,to,"spyCaught",{mission})}
  else{const ok=strength(S,to)>strength(S,from)*1.1&&S.turn>=CEASEFIRE&&chance(0.5);if(ok)declareWar(S,to,from,"spy caught",true);else summon(S,to,from,"a spy scandal")}}
function runSpy(S,from,o){const n=S.nations[from],t=S.nations[o.target];if(!t||!t.alive||o.target===from)return;if(!spend(S,from,COST.spy))return;
  if(!chance(0.35)){if(chance(1/3))spyCaught(S,from,o.target,o.mission);else log(S,from,`${MISSIONS[o.mission]} in ${NAT[o.target].name} failed. Your spy got away.`);return}
  if(o.mission==="intel"){n.intel[o.target]=S.turn+3;log(S,from,`Intel stolen: you can see all of ${NAT[o.target].name} for 3 turns.`)}
  else if(o.mission==="sabotage"){const rs=owned(S,o.target);const r=rs.includes(o.region)?o.region:rs.sort((a,b)=>S.regions[b].troops-S.regions[a].troops)[0];if(r){const g=S.regions[r],k=Math.ceil(g.troops*0.25);g.troops-=k;log(S,from,`Sabotage destroyed ${k} troops in ${REG[r].n}.`);log(S,o.target,`Saboteurs destroyed ${k} troops in ${REG[r].n}.`)}}
  else if(o.mission==="economy"){const inc=Math.round(income(S,o.target));t.cash=Math.max(0,t.cash-inc);log(S,from,`Sabotage cost ${NAT[o.target].name} a turn of income.`);log(S,o.target,`Saboteurs cost you ${inc} in lost income.`)}
  else if(o.mission==="unrest"){t.unrest=clamp(t.unrest+20,0,100);log(S,from,`Unrest is spreading in ${NAT[o.target].name}.`);log(S,o.target,"Agitators stirred up unrest.");
    if(t.gov==="mon"&&chance(0.15))crisis(S,o.target,"agitators");if(t.gov==="dic"&&chance(0.15))coup(S,o.target,"agitators")}
  else if(o.mission==="rig"){if(t.gov==="dem"){t.rigged=true;log(S,from,`Next ${NAT[o.target].name} election will be rigged.`)}else log(S,from,`${NAT[o.target].name} holds no elections.`)}}

function crisis(S,id,why){const n=S.nations[id];n.support.mon+=5;log(S,"all",`Succession crisis in ${NAT[id].name}: a rival claimant rises (${why}).`);breakAway(S,id,"rival claimant")}
function coup(S,id,why){const n=S.nations[id];n.support.mon+=5;const to=pick(["dem","mon"]);log(S,"all",`Coup in ${NAT[id].name} (${why}).`);changeGov(S,id,to,"coup");n.unrest=clamp(n.unrest-10,0,100)}
function revolution(S,id){const n=S.nations[id];n.support.mon+=5;const opts=Object.keys(GOVN).filter(g=>g!==n.gov).sort((a,b)=>n.support[b]-n.support[a]);
  log(S,"all",`The government of ${NAT[id].name} was overthrown!`);changeGov(S,id,opts[0],"overthrow");breakAway(S,id,"overthrow");n.unrest=45;n.maxTurns=0}

function offer(S,from,to,kind,extra){const o={id:S.nextOffer++,from,to,kind,turn:S.turn,...extra};S.offers.push(o);return o}

const TRIB_PCTS=[10,20,30];
function termText(o){const p=o.pct||20;return({none:"no terms",getTribute:`they pay ${p}% of their treasury`,payTribute:`we pay ${p}% of our treasury`,getRegion:`they cede ${REG[o.region]?.n||"a region"}`,giveRegion:`we cede ${REG[o.region]?.n||"a region"}`}[o.terms||"none"])}
function termsFor(o,viewer){if(viewer!==o.to)return termText(o);const p=o.pct||20,r=REG[o.region]?.n||"a region";return({none:"no terms",getTribute:`you pay ${p}% of your treasury`,payTribute:`they pay you ${p}% of their treasury`,getRegion:`you cede ${r}`,giveRegion:`they cede ${r} to you`}[o.terms||"none"])}
function payPct(S,from,to,pct){const amt=Math.floor(S.nations[from].cash*pct/100);S.nations[from].cash-=amt;S.nations[to].cash+=amt;return amt}
function cede(S,r,from,to){if(S.regions[r]?.owner===from&&S.nations[from].capital!==r){S.regions[r].owner=to;S.regions[r].def=0;log(S,"all",`${NAT[from].name} ceded ${REG[r].n} to ${NAT[to].name}.`);return true}return false}
function applyOffer(S,o,accept,resp){const a=o.from,b=o.to,R=rel(S,a,b);if(!R||!S.nations[a].alive||!S.nations[b].alive)return;
  const na=NAT[a].name,nb=NAT[b].name,choice=resp?.choice;
  if(o.kind==="ally"){if(accept&&canAlly(R)&&!allyOf(S,a)&&!allyOf(S,b)){setLevel(S,a,b,2);log(S,"all",`${na} and ${nb} formed an alliance.`)}else log(S,a,`${nb} declined your alliance${o.why?": "+o.why:""}.`)}
  else if(o.kind==="trade"){if(accept&&R.level>=0){R.trade=true;log(S,"all",`${na} and ${nb} signed a trade deal.`)}else log(S,a,`${nb} declined your trade deal.`)}
  else if(o.kind==="peace"){if(R.level!==-2)return;
    if(choice==="counter"){const c=offer(S,b,a,"peace",{terms:resp.terms||"none",pct:resp.pct,region:resp.region});
      log(S,a,`${nb} countered your peace offer: ${termsFor(c,a)}.`);log(S,"all",`${nb} made a counter-offer to ${na}'s peace proposal.`);
      if(!S.nations[a].human){applyOffer(S,c,botPeace(S,c));S.offers=S.offers.filter(x=>x.id!==c.id)}return}
    if(accept){setLevel(S,a,b,-1);R.truce=3;log(S,"all",`${na} and ${nb} signed a peace treaty.`);
      const T=o.terms||"none",p=o.pct||20;if(T==="getTribute")log(S,"all",`${nb} paid ${payPct(S,b,a,p)} to ${na} under the treaty.`);if(T==="payTribute")log(S,"all",`${na} paid ${payPct(S,a,b,p)} to ${nb} under the treaty.`);if(T==="getRegion")cede(S,o.region,b,a);if(T==="giveRegion")cede(S,o.region,a,b)}
    else{log(S,a,`${nb} declined your peace offer.`);log(S,"all",`${nb} rejected peace with ${na}.`)}}
  else if(o.kind==="tribute"){const what=o.region?REG[o.region].n:`${o.pct||20}% of its treasury`;addGriev(S,b,a);if(choice==="summon")summon(S,b,a,"an insulting tribute demand");
    if(accept){if(o.region)cede(S,o.region,b,a);else{const amt=payPct(S,b,a,o.pct||20);log(S,"all",`${nb} paid ${amt} in tribute to ${na}.`)}}
    else{log(S,"all",`${nb} refused ${na}'s demand for ${what}.`);addGriev(S,a,b);
      if(S.nations[a].human)offer(S,a,b,"tribRefused");else botTribRefused(S,a,b)}}
  else if(o.kind==="tribRefused"){if(accept)declareWar(S,a,b,"tribute refused",true);else{S.nations[a].unrest=clamp(S.nations[a].unrest+10,0,100);log(S,"all",`${na} backed down from its tribute demand and lost face.`)}}
  else if(o.kind==="spyCaught"){if(choice==="war")declareWar(S,b,a,"spy caught",true);else if(choice==="summon")summon(S,b,a,"a spy scandal");else log(S,b,`You let ${na}'s spying pass without comment.`)}
  else if(o.kind==="article5"){if(atWar(S,b,o.attacker))return;article5(S,b,a,o.attacker,choice||"nothing",resp?.pct)}
  else if(o.kind==="govReview"){if(choice==="peace"&&atWar(S,a,b)){const c=offer(S,b,a,"peace",{terms:resp.terms||"none",pct:resp.pct,region:resp.region});log(S,"all",`${nb}'s new government is seeking peace with ${na}.`);
      if(!S.nations[a].human){const yes=botRespond(S,c);applyOffer(S,c,yes,yes?null:botCounter(S,c));S.offers=S.offers.filter(x=>x.id!==c.id)}}else log(S,b,`Your new government will keep fighting ${na}.`)}
  else if(o.kind==="joinWar"){if(accept){if(!atWar(S,b,o.target))declareWar(S,b,o.target,"joining its ally "+na,true)}else log(S,a,`${nb} chose not to join your war.`)}}

/* ===== ROBOTS ===== */
function botPolicy(S,id){const n=S.nations[id];if(n.forced>0)return;
  const base={warlord:32,merchant:24,schemer:28,turtle:22}[n.pers];n.tax=clamp(base+(n.gov==="dic"?10:0)-(n.unrest>60?8:0),5,maxTax(n));
  const b={...BUDGET_PRESET[n.pers]};if(n.unrest>55){b.prop+=15;b.troops-=15}n.budget=b}
function allyVeto(S,me,them){const R=rel(S,me,them);if(!canAlly(R))return "relations aren't warm enough yet";if(allyOf(S,me))return "they already have an ally";if(allyOf(S,them))return "you already have an ally";
  if(S.nations[them].rep<=-4)return "your reputation is too poor";const share=owned(S,them).length/Object.keys(S.regions).length;if(share>=0.4)return "you're growing too powerful";return null}
function botPeace(S,o){const me=o.to,them=o.from,ms=strength(S,me),ts=strength(S,them);let p=ms<ts*0.8?0.8:ms<ts*1.2?0.5:0.25;
  const pct=(o.pct||20)/100,totPop=owned(S,me).reduce((t,r)=>t+S.regions[r].pop,0)||1,oPop=owned(S,them).reduce((t,r)=>t+S.regions[r].pop,0)||1;
  if(o.terms==="getTribute")p-=pct*1.5;if(o.terms==="payTribute")p+=pct;if(o.terms==="getRegion")p-=(S.regions[o.region]?.pop||0)/totPop*2;if(o.terms==="giveRegion")p+=(S.regions[o.region]?.pop||0)/oPop;
  if(S.nations[me].peaceMood>S.turn)p+=rel(S,me,them)?.aggressor===me?0.35:0.15;
  return chance(clamp(p,0.03,0.95))}
function botCounter(S,o){const me=o.to,them=o.from;if(o.kind!=="peace"||!chance(0.5))return null;const ms=strength(S,me),ts=strength(S,them);
  if(ms>ts*1.2)return{choice:"counter",terms:"getTribute",pct:10};if(o.terms&&o.terms!=="none")return{choice:"counter",terms:"none"};return null}
function botRespond(S,o){const me=o.to,them=o.from,n=S.nations[me],R=rel(S,me,them),ms=strength(S,me),ts=strength(S,them),L=leader(S);
  if(S.nations[them].rep<=-4&&o.kind!=="peace"&&o.kind!=="tribute")return false;
  if(o.kind==="ally"){const why=allyVeto(S,me,them);if(why){o.why=why;return false}
    const shared=alive(S).some(c=>c!==me&&c!==them&&atWar(S,me,c)&&atWar(S,them,c)),threatL=L&&L!==me&&L!==them;
    const p=0.55+(shared?0.3:0)+(threatL?0.15:0)-(n.diff==="easy"?0.2:0);if(chance(p))return true;o.why="they want more time to trust you";return false}
  if(o.kind==="trade")return R.level>=0&&(n.pers==="merchant"||chance(0.6));
  if(o.kind==="peace")return botPeace(S,o);
  if(o.kind==="tribute"){const totPop=owned(S,me).reduce((t,r)=>t+S.regions[r].pop,0)||1,cost=o.region?(S.regions[o.region]?.pop||0)/totPop*2:(o.pct||20)/100*1.5;return ms<ts*(0.9-cost)}
  return false}
function botTribRefused(S,a,b){applyOffer(S,{from:a,to:b,kind:"tribRefused"},strength(S,a)>strength(S,b)*1.3&&S.turn>=CEASEFIRE)}
function distToBorder(S,id){const d={};const q=[];for(const r of owned(S,id))if(ADJ[r].some(a=>{const o=S.regions[a].owner;return o!==id&&!(o&&allied(S,id,o))})){d[r]=0;q.push(r)}
  while(q.length){const r=q.shift();for(const a of ADJ[r])if(S.regions[a].owner===id&&d[a]===undefined){d[a]=d[r]+1;q.push(a)}}return d}
function botOrders(S,id){const n=S.nations[id],O=[],L=leader(S),D=n.diff,P=n.pers;
  if(isPolicyTurn(S))botPolicy(S,id);
  if(!n.capital){const rs=owned(S,id).sort((a,b)=>S.regions[b].pop-S.regions[a].pop);if(rs[0])O.push({t:"capital",region:rs[0]})}
  const my=strength(S,id);
  for(const o of alive(S)){if(o===id)continue;const R=rel(S,id,o),os=strength(S,o);
    if(R.level===-2&&(my<os*0.8||chance(0.08))&&chance(D==="easy"?0.2:0.35))O.push({t:"dip",kind:"peace",target:o,terms:my>os*1.4?"getTribute":"none"});
    if(canAlly(R)&&!allyVeto(S,o,id)&&D!=="easy"&&!allyOf(S,id)&&!allyOf(S,o)&&chance(S.nations[o].human?0.2:0.12))O.push({t:"dip",kind:"ally",target:o});
    if(R.level>=0&&!R.trade&&chance(P==="merchant"?0.5:0.15))O.push({t:"dip",kind:"trade",target:o});
    if(R.level===0&&n.cash>60&&P==="merchant"&&chance(0.15))O.push({t:"dip",kind:"gift",target:o,amount:10});
    if(R.level<=0&&R.level>-2&&my>os*1.6&&P==="warlord"&&S.turn>=CEASEFIRE&&chance(0.1))O.push({t:"dip",kind:"tribute",target:o,pct:pick(TRIB_PCTS)})}
  if(n.cash>70)O.push({t:"recruit",n:Math.floor((n.cash-40)/COST.troop)});
  const spyRate={easy:0.05,normal:0.2,hard:0.35}[D]*(P==="schemer"?2:1);
  if(n.cash>30&&chance(spyRate)){const tg=L&&L!==id?L:pick(alive(S).filter(x=>x!==id));if(tg){const m=pick(["intel","sabotage","economy","unrest",S.nations[tg].gov==="dem"?"rig":"unrest"]);O.push({t:"spy",target:tg,mission:m})}}
  const ratio={easy:1.4,normal:1.35,hard:1.2}[D];const used={};
  for(const r of owned(S,id)){const g=S.regions[r];let avail=g.troops-1-(r===n.capital?Math.ceil(g.troops*0.35):0);if(avail<2)continue;
    let best=null,bs=-1e9;
    for(const a of ADJ[r]){const t=S.regions[a];if(t.owner===id)continue;const tw=t.owner;
      if(tw){const R=rel(S,id,tw);if(R.level===2||R.truce>0||S.turn<CEASEFIRE)continue;

  case"policy":return `Set tax ${o.tax}% and budget`;
  case"capital":return `Move capital to ${REG[o.region].n}`;
  case"focus":return `Rally point: ${REG[o.region].n}`;
  case"recruit":return `Recruit ${o.n} troops in ${REG[o.region]?.n||"rally point"} from treasury`;
  case"airlift":return `Air-drop ${o.n} from ${REG[o.from].n} to ${REG[o.to].n} (whole turn)`}};
const actionCount=()=>myOrders.filter(o=>ACTIONS.includes(o.t)).reduce((t,o)=>t+actW(o),0);
const spiesAt=t=>myOrders.filter(o=>o.t==="spy"&&o.target===t).length;

function spendQueued(){return myOrders.reduce((t,o)=>t+(o.t==="spy"?COST.spy:o.t==="dip"&&o.kind==="gift"?o.amount:o.t==="recruit"?o.n*COST.troop:0),0)}
function addOrder(o){
  if(ACTIONS.includes(o.t)&&actionCount()+actW(o)>ACTION_CAP){toast(o.t==="airlift"?"An air-drop uses your whole turn. Remove your other troop and spy orders first.":`You can give ${ACTION_CAP} troop or spy orders per turn`);return}
  if(o.t==="spy"&&spiesAt(o.target)>=SPY_CAP){toast(`Max ${SPY_CAP} spies per nation per turn`);return}
  if(o.t==="policy")myOrders=myOrders.filter(x=>x.t!=="policy");
  if(o.t==="resp")myOrders=myOrders.filter(x=>!(x.t==="resp"&&x.id===o.id));
  if(o.t==="dip")myOrders=myOrders.filter(x=>!(x.t==="dip"&&x.target===o.target&&x.kind===o.kind));

  myOrders.push(o);saveDraft();render()}

const gref=()=>db.doc("wgames/"+code);
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ";return Array.from({length:4},()=>A[rnd(A.length)]).join("")}
async function createLobby(){if(busy)return;busy=true;code=genCode();
  try{await db.doc("wgames/"+code).set({host:me,players:{[me]:setup.nat},diff:setup.diff,phase:"lobby",created:Date.now()});lsSet("sov-code",code);listen();screen="lobby"}
  catch(e){toast("Couldn't create the game. Check the Firestore rules.")}busy=false;render()}
async function joinLobby(c){c=(c||"").trim().toUpperCase();if(c.length!==4){toast("Codes are 4 letters");return}if(busy)return;busy=true;
  try{const s=await db.doc("wgames/"+c).get();if(!s.exists){toast("No game with that code");busy=false;return}const L=s.data();
    if(!(me in (L.players||{}))){if(Object.keys(L.players||{}).length>=2||L.phase!=="lobby"){toast("That game is full or already started");busy=false;return}
      await db.doc("wgames/"+c).update({["players."+me]:null})}

  else if(L.phase==="play"||L.phase==="over"){const st=typeof L.state==="string"?JSON.parse(L.state):null;if(st){if(lastTurnSeen!==st.turn){if(lastTurnSeen!==null&&S){results=S.turn;soundsFor(S.turn,st)}lastTurnSeen=st.turn;myOrders=[];submitted=!!L.done?.[me];target=null;confirmAtk=null}S=st;if(!sel)sel=NAT[myNat].home}

    case"guestNat":gref().update({["players."+me]:setup.nat}).catch(()=>toast("Couldn't save your choice"));break;
    case"leaveLobby":if(unsub){unsub();unsub=null}lsSet("sov-code",null);if(lobby&&lobby.host!==me)gref().update({["players."+me]:deleteField()}).catch(()=>{});mode=null;lobby=null;screen="home";render();break;
    case"invite":{const url=location.origin+location.pathname+"?g="+code;if(navigator.share)navigator.share({title:"Sovereign",text:"Join my game: "+code,url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>toast("Invite link copied"),()=>toast(url));break}
    case"startMp":startMp();break;
    case"claim":claim(id);break;
    case"tab":tab=id;render();break;
    case"region":if(sel!==id){sel=id;target=null;amount=1}else if(S.regions[id].owner!==myNat){sel=id}render();break;
    case"target":target=target===id?null:id;amount=Math.max(1,S.regions[sel].troops-(S.regions[sel].def>0?0:1)-committed(sel));render();break;
    case"addMove":{const free=freeAt(sel),k=Math.min(amount,free);if(k<1)return;const o=S.regions[target].owner,host=o&&o!==myNat&&basing(S,o,myNat),atk=o!==myNat&&!host;
      const ord={t:atk?"attack":"move",from:sel,to:target,n:k};
      if(atk&&o&&rel(S,myNat,o)?.level>-2&&!hasGrievance(S,myNat,o)&&!myOrders.some(x=>x.t==="attack"&&S.regions[x.to].owner===o)){if(actionCount()>=ACTION_CAP){toast(`You can give ${ACTION_CAP} troop or spy orders per turn`);break}confirmAtk=ord;render();break}
      addOrder(ord);target=null;render();break}
    case"airlift":addOrder({t:"airlift",from:sel,to:$("#dropTo").value,n:+$("#dropN").value});break;
    case"confirmAtk":{const o=confirmAtk;confirmAtk=null;target=null;addOrder(o);break}
    case"cancelAtk":confirmAtk=null;render();break;
    case"closeResults":results=null;render();try{window.scrollTo(0,0)}catch{}break;
    case"mute":muted=!muted;lsSet("sov-mute",muted?"1":null);if(!muted)play("turn");render();break;
    case"focus":addOrder({t:"focus",region:sel});break;
    case"capital":addOrder({t:"capital",region:sel});break;
    case"rmOrder":myOrders.splice(+el.dataset.i,1);saveDraft();render();break;
    case"resp":{const ch=el.dataset.v,o={t:"resp",id:+id,from:el.dataset.from,choice:ch};if(ch==="counter")Object.assign(o,parseTerms($("#ctr-"+id)?.value));if(ch==="peace")Object.assign(o,parseTerms($("#gr-"+id)?.value));if(ch==="funds")o.pct=+el.dataset.pct;addOrder(o);break}
    case"gift":{const amt=+el.dataset.n,ex=myOrders.findIndex(x=>x.t==="dip"&&x.kind==="gift"&&x.target===id);if(ex>=0&&myOrders[ex].amount===amt){myOrders.splice(ex,1);saveDraft();render();break}
      if(S.nations[myNat].cash-spendQueued()+(ex>=0?myOrders[ex].amount:0)<amt){toast("Not enough in the treasury");break}if(ex>=0)myOrders.splice(ex,1);addOrder({t:"dip",kind:"gift",target:id,amount:amt});break}
    case"dip":{const k=el.dataset.k;const ex=myOrders.findIndex(x=>x.t==="dip"&&x.target===id&&x.kind===k);if(ex>=0){myOrders.splice(ex,1);saveDraft();render();break}
      const o={t:"dip",kind:k,target:id};
      if(k==="peace")Object.assign(o,parseTerms($("#terms-"+id)?.value));
      if(k==="tribute"){const v=$("#trib-"+id)?.value||"20";if(v.startsWith("r:"))o.region=v.slice(2);else o.pct=+v}addOrder(o);break}
    case"spy":{const t=$("#spyT").value,m=$("#spyM").value;addOrder({t:"spy",target:t,mission:m});toast("Spy dispatched when the turn ends");break}
    case"savePol":{const b={};for(const k of ["troops","def","infra","prop"])b[k]=+$("#b-"+k).value;const tot=Object.values(b).reduce((a,x)=>a+x,0);if(tot>100){toast("Allocations can't exceed 100%");break}b.res=100-tot;addOrder({t:"policy",tax:+$("#tax").value,budget:b});toast("Policy set for this term");break}
    case"recruit":{const k=+$("#rec").value;if(S.nations[myNat].cash-spendQueued()<k*COST.troop){toast("Not enough in the treasury");break}myOrders=myOrders.filter(x=>x.t!=="recruit");addOrder({t:"recruit",n:k,region:$("#recR").value});break}
    case"endTurn":document.activeElement?.blur?.();actx();
      if(!armEnd){armEnd=true;clearTimeout(armT);armT=setTimeout(()=>{armEnd=false;render()},3000);render();break}
      armEnd=false;clearTimeout(armT);if(mode==="solo")endTurnSolo();else submitOrders();break}});

/* ---------- boot ---------- */
(async()=>{render();
  if(firebaseConfig.apiKey){try{const fa=initializeApp(firebaseConfig),auth=getAuth(fa);await signInAnonymously(auth);me=auth.currentUser.uid;db=makeDb(getFirestore(fa))}catch{toast("Online play unavailable right now")}}
  const inv=new URLSearchParams(location.search).get("g");if(inv&&db){history.replaceState(null,"",location.pathname);setup={nat:null,diff:"normal"};joinLobby(inv)}else render()})();

</script>
</body>
</html>
