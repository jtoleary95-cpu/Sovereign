.bar{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--act)}.bar.lo>span{background:var(--war)}

.snd{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}.snd p{margin:0}

.offer,.ncard{background:var(--panel);border-left:5px solid var(--nc);border-radius:0 8px 8px 0;padding:8px 10px;margin:8px 0}.ncard.dead{opacity:.5}
.nhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.nhead b{font-family:"Archivo Narrow",sans-serif;font-size:1.1rem}
.rel{font-size:.85rem;font-weight:600;margin-left:auto}.rel.r-2{color:var(--war)}.rel.r-1{color:#C0712B}.rel.r1{color:var(--ally)}.rel.r2{color:var(--ally)}
.orders{margin-top:14px}.ord{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:.95rem}
.x{border:0;background:transparent;font-size:1.1rem;min-width:36px;min-height:36px;color:var(--soft)}
.endbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.endbar .btn{flex:1;max-width:500px}.endbar .btn.armed{background:var(--war);border-color:var(--war)}.timer{font:700 1.3rem "Archivo Narrow",sans-serif;min-width:48px;text-align:center}.timer.hot{color:var(--hot)}
.logl{font-size:.93rem;margin:3px 0}.logl.mine{font-weight:600}
.over{text-align:center;background:var(--panel);border-radius:8px;padding:14px;margin:8px 0}.banner{font:700 2.6rem "Archivo Narrow",sans-serif}.over.won .banner{color:var(--ally)}
.rules{margin:18px 0}.rules summary{font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;max-width:90vw;z-index:20;transition:opacity .2s}
.toast[hidden]{display:block;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc as fdoc, getDoc, setDoc, updateDoc, onSnapshot, deleteField, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== FIREBASE CONFIG (same project as Deep Salvo) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBcsUoFs2p9MBd_ZA5QdCznjmhYimHGmw0",
  authDomain: "battle-ship-7f0d9.firebaseapp.com",
  projectId: "battle-ship-7f0d9",
  storageBucket: "battle-ship-7f0d9.firebasestorage.app",
  messagingSenderId: "622001257172",
  appId: "1:622001257172:web:841fb2a3f10a8d5ce11941"
};
function wrap(s){return{exists:s.exists(),data:()=>s.data(),metadata:s.metadata}}
function makeDb(fs){return{doc(p){const r=fdoc(fs,p);return{get:async()=>wrap(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),onSnapshot:(n,e)=>onSnapshot(r,s=>n(wrap(s)),e),
  claim:(map,key,val,ok)=>runTransaction(fs,async tx=>{const s=await tx.get(r);const d=s.data()||{};const cur=map.split(".").reduce((o,k)=>o?.[k],d)?.[key];if(cur||!ok(d,val))return false;tx.update(r,{[map+"."+key]:val});return true})}}}}
/* ===== ENGINE: pure game rules ===== */
const REG={
  GRL:{n:"Greenland",c:0,r:0,pop:25}, USA:{n:"USA",c:0,r:1,pop:260}, CAM:{n:"C. America",c:0,r:2,pop:90}, AND:{n:"Andes",c:0,r:3,pop:90}, ARG:{n:"Argentina",c:0,r:4,pop:70},
  UK:{n:"UK",c:1,r:0,pop:110}, WEU:{n:"W. Europe",c:1,r:1,pop:200}, WAF:{n:"W. Africa",c:1,r:2,pop:130}, BRA:{n:"Brazil",c:1,r:3,pop:170},
  RUS:{n:"Russia",c:2,r:0,pop:200}, EEU:{n:"E. Europe",c:2,r:1,pop:130}, MEA:{n:"Mid East",c:2,r:2,pop:130}, EGY:{n:"Egypt",c:2,r:3,pop:110}, SAF:{n:"S. Africa",c:2,r:4,pop:90},
  SIB:{n:"Siberia",c:3,r:0,pop:70}, CHN:{n:"China",c:3,r:1,pop:240}, IND:{n:"India",c:3,r:2,pop:260}, SEA:{n:"SE Asia",c:3,r:3,pop:170},
  JAP:{n:"Japan",c:4,r:0.5,pop:130}, AUS:{n:"Australia",c:4,r:4,pop:70}
};
const LAND=[["USA","CAM"],["CAM","AND"],["AND","ARG"],["AND","BRA"],["BRA","ARG"],["WEU","EEU"],["EEU","RUS"],["EEU","MEA"],["WEU","WAF"],["WAF","EGY"],["WAF","SAF"],["EGY","MEA"],["EGY","SAF"],["RUS","SIB"],["SIB","CHN"],["CHN","IND"],["IND","SEA"],["MEA","IND"],["CHN","SEA"]];
const SEA=[["GRL","USA"],["GRL","UK"],["UK","WEU"],["BRA","WAF"],["JAP","SIB"],["JAP","CHN"],["SEA","AUS"]];
const ADJ={};for(const k in REG)ADJ[k]=[];for(const[a,b]of[...LAND,...SEA]){ADJ[a].push(b);ADJ[b].push(a)}
const NAT={
  USA:{name:"USA",home:"USA",tier:"strong",gov:"dem",color:"#1F5FBF"},
  CHN:{name:"China",home:"CHN",tier:"strong",gov:"dic",color:"#C62828"},
  RUS:{name:"Russia",home:"RUS",tier:"strong",gov:"dic",color:"#6A1B9A"},
  IND:{name:"India",home:"IND",tier:"mid",gov:"dem",color:"#EF6C00"},
  JAP:{name:"Japan",home:"JAP",tier:"mid",gov:"mon",color:"#E0457B"},
  UK:{name:"UK",home:"UK",tier:"mid",gov:"mon",color:"#00838F"},
  BRA:{name:"Brazil",home:"BRA",tier:"weak",gov:"dem",color:"#6FA82F"},
  EGY:{name:"Egypt",home:"EGY",tier:"weak",gov:"dic",color:"#7B5B3A"}
};
const HOMES=Object.values(NAT).map(x=>x.home);
const TIER={strong:{cash:60,troops:30},mid:{cash:45,troops:22},weak:{cash:30,troops:15}};
const GOVN={dem:"Democracy",mon:"Monarchy",dic:"Dictatorship"};
const RELN={"-2":"War","-1":"Negative","0":"Neutral","1":"Positive","2":"Alliance"};
const COST={troop:2,def:3,spy:8,infra:25,capital:20};
const NEUTRAL_DEF=5,NEUTRAL_CAP_DEF=8,CEASEFIRE=4,STALE_TURN=25,ACTION_CAP=3,SPY_CAP=2;
const ACTIONS=["move","attack","spy","airlift","nukeStrike"];const actW=o=>o.t==="airlift"?ACTION_CAP:1;
const MISSIONS={distrust:"Sow distrust in their alliance",intel:"Steal intel",sabotage:"Sabotage troops",economy:"Sabotage economy",unrest:"Stir unrest",rig:"Rig election"};
const PERS=["warlord","merchant","schemer","turtle"];
const BUDGET_PRESET={warlord:{troops:55,def:10,infra:10,prop:10,res:15},merchant:{troops:30,def:10,infra:30,prop:10,res:20},schemer:{troops:35,def:10,infra:10,prop:10,res:35},turtle:{troops:30,def:35,infra:15,prop:10,res:10}};
const FORCED={tax:15,budget:{troops:15,def:20,infra:25,prop:25,res:15}};

const rnd=n=>Math.floor(Math.random()*n);
const chance=p=>Math.random()<p;
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pk=(a,b)=>a<b?a+"|"+b:b+"|"+a;
const rel=(S,a,b)=>S.rel[pk(a,b)];
const owned=(S,id)=>Object.keys(S.regions).filter(r=>S.regions[r].owner===id);
const alive=S=>Object.keys(S.nations).filter(n=>S.nations[n].alive);
const strength=(S,id)=>owned(S,id).reduce((t,r)=>t+S.regions[r].troops+S.regions[r].def,0)+Object.values(S.regions).reduce((t,g)=>t+(g.guest?.nat===id?g.guest.n:0),0);
const allied=(S,a,b)=>a!==b&&rel(S,a,b)?.level===2;
const allyOf=(S,a)=>alliesOf(S,a)[0]||null;
const atWar=(S,a,b)=>rel(S,a,b)?.level===-2;
const log=(S,to,text)=>S.log.push({t:S.turn,to,text});
const isPolicyTurn=S=>S.turn%5===1;
const maxTax=n=>n.gov==="dic"?70:50;
function leader(S){let best=null,bc=-1;for(const n of alive(S)){const c=owned(S,n).length;if(c>bc){bc=c;best=n}}return best}

/* seats: [{nat, human:uid|null, diff, pers}]  picks: {nat: regionId} */
function newState(seats,picks,opts){
  const S={alliances:[],nextAlliance:1,joins:[],opts:opts||{},turn:1,regions:{},nations:{},rel:{},offers:[],log:[],hold:{},winner:null,over:false,nextOffer:1,caps:seats.map(s=>NAT[s.nat].home)};
  for(const k in REG)S.regions[k]={owner:null,troops:HOMES.includes(k)?NEUTRAL_CAP_DEF:NEUTRAL_DEF,def:0,pop:REG[k].pop,infra:0};
  for(const s of seats){const N=NAT[s.nat],T=TIER[N.tier];
    S.nations[s.nat]={id:s.nat,human:s.human||null,diff:s.diff||"normal",pers:s.pers||pick(PERS),gov:N.gov,tax:25,budget:{troops:40,def:15,infra:15,prop:10,res:20},
      cash:T.cash,unrest:20,support:{dem:0,mon:0,dic:0},maxTurns:0,forced:0,capital:N.home,lostSince:null,alive:true,intel:{},rigged:false,
      termWins:0,termLosses:0,propTerm:0,infraFund:0,defFocus:null,rep:0,homeRegions:[N.home,picks[s.nat]].filter(Boolean),lostThisTurn:0,capAttacked:false};
    const home=S.regions[N.home];home.owner=s.nat;home.troops=Math.ceil(T.troops*0.65);
    const p=picks[s.nat];if(p){const r=S.regions[p];r.owner=s.nat;r.troops=T.troops-home.troops}}
  const ids=Object.keys(S.nations);
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)S.rel[pk(ids[i],ids[j])]={level:0,prog:0,quiet:0,truce:0,trade:false,allySince:null};
  for(const id of ids){const n=S.nations[id];if(pol(S))initPolitics(n);if(nukes(S))nk(n)}
  if(pol(S))for(const id of ids)makeDemand(S,id);
  for(const id of ids)if(!S.nations[id].human)botPolicy(S,id);
  log(S,"all",`Ceasefire: nations cannot attack each other before turn ${CEASEFIRE}. Neutral regions are fair game from turn 1.`);
  return S}

function pickChoices(taken,nat){return ADJ[NAT[nat].home].filter(r=>!HOMES.includes(r)&&!taken.includes(r))}

/* visibility for a nation */
function visible(S,me){const v=new Set(),full=new Set();const n=S.nations[me];if(!n)return{v,full};if(!n.alive){for(const k in S.regions)v.add(k);for(const o of alive(S))full.add(o);return{v,full}}
  for(const r of owned(S,me)){v.add(r);for(const a of ADJ[r])v.add(a)}
  for(const o of alive(S))if(o!==me&&(allied(S,me,o)||(n.intel[o]||0)>=S.turn)){full.add(o);for(const r of owned(S,o)){v.add(r);if(allied(S,me,o))for(const a of ADJ[r])v.add(a)}}
  return{v,full}}

function income(S,id){const n=S.nations[id];let inc=0;
  for(const r of owned(S,id)){const g=S.regions[r];inc+=g.pop*n.tax/100*0.1*(1+0.15*g.infra)}
  let trade=0;if(!(n.tradeBlock>S.turn))for(const o of alive(S))if(o!==id&&rel(S,id,o)?.trade)trade+=n.gov==="dem"?0.15:0.10;for(const o of alive(S))if(allied(S,id,o))trade+=0.05;
  inc*=1+trade;if(n.unrest>50)inc*=1-(n.unrest-50)/100;return Math.max(0,inc)}

function dice(k){return Array.from({length:k},()=>1+rnd(6)).sort((a,b)=>b-a)}
function battle(att,def,bonus,tieAtt){while(att>0&&def>0){const A=dice(Math.min(3,att)),D=dice(Math.min(2,def));if(bonus)D[0]+=1;for(let i=0;i<Math.min(A.length,D.length);i++){if(A[i]>D[i]||(tieAtt&&A[i]===D[i]))def--;else att--}}return{att,def}}

function winChance(att,def,bonus,n=400){let w=0;for(let i=0;i<n;i++)if(battle(att,def,bonus).def<=0)w++;return w/n}
function setLevel(S,a,b,l){const R=rel(S,a,b);if(!R)return;const was=R.level;R.level=l;R.prog=0;R.quiet=0;if(l<0)R.trade=false;if(l!==2)R.allySince=null;if(l===2&&was!==2)R.allySince=S.turn;
  if(was===2&&l!==2&&!S._allyGuard&&S.alliances){const keep=l;S._allyGuard=true;R.level=was;S._allyGuard=false;leaveAlliance(S,a);if(rel(S,a,b).level!==keep&&keep!==-1)rel(S,a,b).level=keep;}
  if(was===2&&l!==2){R.base={};for(const k in S.regions){const g=S.regions[k];if(g.guest&&((g.owner===a&&g.guest.nat===b)||(g.owner===b&&g.guest.nat===a))){const home=S.nations[g.guest.nat].capital;if(home&&S.regions[home].owner===g.guest.nat)S.regions[home].troops+=g.guest.n;g.guest=null}}}}
const basing=(S,host,guest)=>allied(S,host,guest)&&!!rel(S,host,guest)?.base?.[host];
const dropRel=(S,a,b,k)=>{const R=rel(S,a,b);if(R&&R.level>-2&&R.level<2)setLevel(S,a,b,Math.max(-1,R.level-k))};
const MISSION_VERB={distrust:"sow distrust in their alliance",intel:"steal state secrets",sabotage:"sabotage troops",economy:"sabotage the economy",unrest:"stir up unrest",rig:"rig an election"};
const hasGrievance=(S,a,b)=>{const t=rel(S,a,b)?.griev?.[a];return t!=null&&S.turn-t<=3};
function addGriev(S,a,b){const R=rel(S,a,b);if(!R)return;R.griev=R.griev||{};R.griev[a]=S.turn;R.sumUsed=R.sumUsed||{};R.sumUsed[a]=false}
const canSummon=(S,a,b)=>{const R=rel(S,a,b);return !!R&&R.level>-2&&R.level<2&&hasGrievance(S,a,b)&&!R.sumUsed?.[a]};
const canAlly=R=>R&&R.level===1&&!!R.trade;
const canDeclare=(S,a,b)=>{const R=rel(S,a,b);return !!R&&R.level!==-2&&R.level!==2&&R.truce<=0&&S.turn>=CEASEFIRE};
function summon(S,a,b,why){const R=rel(S,a,b);if(!R||R.level===-2||R.level===2)return;addGriev(S,a,b);R.griev[a]=S.turn-2;R.sumUsed[a]=true;S.nations[b].tradeBlock=S.turn+2;if(R.level>-1)setLevel(S,a,b,R.level-1);
  log(S,"all",`${NAT[a].name} summoned ${NAT[b].name}'s ambassador${why?" over "+why:""}. ${NAT[b].name} loses its trade income for 2 turns.`)}
function declareWar(S,a,b,why,force){const R=rel(S,a,b);if(!R||R.level===-2)return false;if(!force&&!canDeclare(S,a,b))return false;
  const na=S.nations[a];if(!force&&pol(S)&&na.oppBlock){na.oppBlock=false;log(S,"all",`${NAT[a].name}'s opposition blocked its declaration of war on ${NAT[b].name}.`);return false}
  if(na.demand?.k==="noWar")na.demand.wars=(na.demand.wars||0)+1;
  const unprovoked=!force&&!hasGrievance(S,a,b);
  if(R.level>=0)S.nations[a].rep-=1;if(R.level===2)S.nations[a].rep-=1;setLevel(S,a,b,-2);R.truce=0;R.aggressor=a;
  log(S,"all",`${NAT[a].name} declared war on ${NAT[b].name}${why?" ("+why+")":unprovoked?", unprovoked":""}.`);
  if(unprovoked){S.nations[a].rep-=2;const hit=[];for(const c of alive(S)){if(c===a||c===b||allied(S,a,c))continue;const Rc=rel(S,a,c);if(Rc&&Rc.level>-1){setLevel(S,a,c,Rc.level-1);hit.push(NAT[c].name)}}
    if(hit.length)log(S,"all",`The unprovoked attack turned opinion against ${NAT[a].name}: relations fell with ${hit.join(", ")}.`)}
  // common enemy: nations already fighting the same foe warm to each other
  for(const c of alive(S)){if(c===a||c===b)continue;
    if(atWar(S,c,b)){const Rc=rel(S,a,c);if(Rc&&Rc.level>=-1&&Rc.level<1){setLevel(S,a,c,Rc.level+1);log(S,"all",`${NAT[a].name} and ${NAT[c].name} now share an enemy in ${NAT[b].name}. Relations improved.`)}}
    if(atWar(S,c,a)){const Rc=rel(S,b,c);if(Rc&&Rc.level>=-1&&Rc.level<1){setLevel(S,b,c,Rc.level+1);log(S,"all",`${NAT[b].name} and ${NAT[c].name} now share an enemy in ${NAT[a].name}. Relations improved.`)}}}
  for(const defAlly of alliesOf(S,b))if(defAlly!==a&&!atWar(S,defAlly,a)){addGriev(S,defAlly,a);log(S,"all",`${NAT[b].name} invoked Article 5. Its ally ${NAT[defAlly].name} must respond to ${NAT[a].name}'s attack.`);
    if(S.nations[defAlly].human)offer(S,b,defAlly,"article5",{attacker:a});else botArticle5(S,defAlly,b,a)}
  // the aggressor's ally is asked, not obliged
  for(const offAlly of alliesOf(S,a))if(offAlly!==b&&!atWar(S,offAlly,b)){
    if(S.nations[offAlly].human){offer(S,a,offAlly,"joinWar",{target:b});log(S,offAlly,`Your ally ${NAT[a].name} went to war with ${NAT[b].name}. Will you join?`)}
    else{const Rb=rel(S,offAlly,b);if(Rb.level<=0&&chance(0.6))declareWar(S,offAlly,b,"joining its ally "+NAT[a].name,true);else article5(S,offAlly,a,b,"support",0,{basing:true,pct:chance(0.5)?10:0})}}
  return true}
function article5(S,ally,victim,attacker,choice,pct,resp){const na=NAT[ally].name;
  if(choice==="war"){declareWar(S,ally,attacker,"Article 5, defending "+NAT[victim].name,true)}
  else if(choice==="basing"){const R=rel(S,ally,victim);if(R){R.base=R.base||{};R.base[ally]=true}dropRel(S,ally,attacker,2);log(S,"all",`${na} opened its territory to ${NAT[victim].name}'s troops. Relations with ${NAT[attacker].name} fell sharply.`)}
  else if(choice==="funds"){const p=pct||10,amt=payPct(S,ally,victim,p);dropRel(S,ally,attacker,1);log(S,"all",amt>0?`${na} sent ${amt} in war funds to ${NAT[victim].name}. Relations with ${NAT[attacker].name} cooled.`:`${na} pledged war funds to ${NAT[victim].name} but had no money to send.`)}
  else if(choice==="combo"){const any=resp?.war||resp?.basing||resp?.pct;if(!any){article5(S,ally,victim,attacker,"nothing");return}if(resp.war)declareWar(S,ally,attacker,"Article 5, defending "+NAT[victim].name,true);if(resp.basing){const R=rel(S,ally,victim);if(R){R.base=R.base||{};R.base[ally]=true}if(!resp.war)dropRel(S,ally,attacker,2);log(S,"all",`${na} opened its territory to ${NAT[victim].name}'s troops.`)}
    if(resp.pct){const amt=payPct(S,ally,victim,resp.pct);if(!resp.war&&!resp.basing)dropRel(S,ally,attacker,1);log(S,"all",amt>0?`${na} sent ${amt} in war funds to ${NAT[victim].name}.`:`${na} pledged war funds to ${NAT[victim].name} but had no money to send.`)}}
  else if(choice==="support"){if(resp?.basing)article5(S,ally,victim,attacker,"basing");if(resp?.pct)article5(S,ally,victim,attacker,"funds",resp.pct);if(!resp?.basing&&!resp?.pct)article5(S,ally,victim,attacker,"basing")}
  else{setLevel(S,ally,victim,-1);log(S,"all",`${na} ignored Article 5. Its alliance with ${NAT[victim].name} is over.`)}}
function botArticle5(S,ally,victim,attacker){const ms=strength(S,ally),as=strength(S,attacker);const c=ms>as*0.8&&chance(0.6)?"war":chance(0.5)?"funds":chance(0.7)?"basing":"nothing";article5(S,ally,victim,attacker,c,10)}
const nextPolicy=t=>(Math.floor((t-1)/5)+1)*5+1;
function reviewWars(S,id,why,auto){const n=S.nations[id];n.newGov=nextPolicy(S.turn);for(const e of alive(S)){if(e===id||!atWar(S,id,e))continue;const R=rel(S,id,e),aggr=R.aggressor===id;
    if(n.human&&!auto){offer(S,e,id,"govReview",{why});continue}if(!chance(aggr?0.75:0.45)){log(S,"all",`${NAT[id].name}'s new government will keep fighting ${NAT[e].name}.`);continue}
    let t={terms:"none"};if(aggr){const mine=owned(S,id).filter(r=>r!==n.capital).sort((x,y)=>S.regions[x].pop-S.regions[y].pop);t=chance(0.5)||!mine.length?{terms:"payTribute",pct:pick([10,20])}:{terms:"giveRegion",region:mine[0]}}
    log(S,"all",`${NAT[id].name}'s new government is seeking peace with ${NAT[e].name}.`);const o=offer(S,id,e,"peace",t);
    if(!S.nations[e].human){const yes=botRespond(S,o);applyOffer(S,o,yes,yes?null:botCounter(S,o));S.offers=S.offers.filter(x=>x.id!==o.id)}}}
function spend(S,id,amt){const n=S.nations[id];if(n.cash<amt)return false;n.cash-=amt;return true}

function regionCaptured(S,r,newOwner){S.lastCapture=S.turn;const g=S.regions[r],old=g.owner;g.def=0;g.owner=newOwner;g.taken=S.turn;if(old&&old!==newOwner)g.prevOwner=old;if(old&&S.nations[old].pr)S.nations[old].pr.lost++;if(newOwner&&S.nations[newOwner].pr)S.nations[newOwner].pr.won++;if(old&&S.nations[old].climPush)S.nations[old].climPush.dic+=4;
  if(old){const on=S.nations[old];on.lostThisTurn++;on.termLosses++;
    if(on.capital===r){on.capital=null;on.lostSince=S.turn;log(S,old,`Your capital ${REG[r].n} has fallen. Choose a new capital. You have 5 turns to retake ${REG[NAT[old].home].n}.`)}}
  if(newOwner){const nn=S.nations[newOwner];nn.termWins++;nn.unrest=clamp(nn.unrest+2,0,100);
    const move=Math.floor(g.pop*0.2);let left=move;
    for(const o of owned(S,newOwner)){if(o===r||left<=0)continue;const og=S.regions[o],cap=Math.round(REG[o].pop*(1+0.2*og.infra)),room=cap-og.pop;if(room>0){const m=Math.min(room,left);og.pop+=m;left-=m}}
    g.pop-=move-left;
    if(r===NAT[newOwner].home&&nn.capital!==r){nn.capital=r;nn.lostSince=null;log(S,newOwner,`You retook your home capital ${REG[r].n}.`)}}}

function eliminate(S,id,why){const n=S.nations[id];if(!n.alive)return;n.alive=false;for(const r of owned(S,id)){S.regions[r].owner=null;S.regions[r].def=0}
  S.offers=S.offers.filter(o=>o.from!==id&&o.to!==id);log(S,"all",`${NAT[id].name} has been eliminated${why?" ("+why+")":""}.`)}

function breakAway(S,id,why){const cands=owned(S,id).filter(r=>r!==S.nations[id].capital);if(!cands.length)return;const r=pick(cands);S.regions[r].owner=null;S.regions[r].def=0;S.regions[r].troops=5;S.regions[r].guest=null;
  log(S,"all",`${REG[r].n} broke away from ${NAT[id].name} (${why}).`)}

function changeGov(S,id,to,why){const n=S.nations[id];if(n.gov===to)return;n.gov=to;if(n.human&&pol(S)&&(why==="coup"||why==="overthrow")){n.deposed=null;n._depose=why}if(to==="dem"&&n.fac){n.partyChosen=!n.human;n.govTerms=0;if(!n.human){n.myParty=pick(["A","B"]);n.govParty=n.myParty}}n.forced=0;n.tax=Math.min(n.tax,maxTax(n));log(S,"all",`${NAT[id].name} is now a ${GOVN[to]} (${why}).`);if(n._depose){const w=n._depose;n._depose=null;depose(S,id,w)}reviewWars(S,id,why,!!(n.human&&(n.deposed||(n.gov==="dem"&&n.fac&&!govMine(n)))))}

function spyCaught(S,from,to,mission){const R=rel(S,from,to),verb=MISSION_VERB[mission]||"spy";
  log(S,to,`You caught a spy from ${NAT[from].name} trying to ${verb}.`);log(S,from,`Your spy in ${NAT[to].name} was caught trying to ${verb}.`);
  if(!R||R.level===-2)return;addGriev(S,to,from);
  if(R.level===2){if(chance(0.5)){setLevel(S,from,to,-1);log(S,"all",`The ${NAT[from].name}–${NAT[to].name} alliance collapsed over a spy scandal.`)}else log(S,"all",`The ${NAT[from].name}–${NAT[to].name} alliance survived a spy scandal.`);return}
  if(R.level===1){summon(S,to,from,"a spy scandal");return}
  if(S.nations[to].human){offer(S,from,to,"spyCaught",{mission})}
  else{const ok=strength(S,to)>strength(S,from)*1.1&&S.turn>=CEASEFIRE&&chance(0.5);if(ok)declareWar(S,to,from,"spy caught",true);else summon(S,to,from,"a spy scandal")}}
function runSpy(S,from,o){if(o.mission==="distrust"&&o.alliance){const g=(S.alliances||[]).find(k=>k.id===o.alliance);if(!g||g.members.includes(from))return;o.target=pick(g.members.filter(m=>S.nations[m]?.alive))||o.target}const n=S.nations[from],t=S.nations[o.target];if(!t||!t.alive||o.target===from)return;if(!spend(S,from,COST.spy))return;
  if(!chance(0.35)){if(chance(1/3))spyCaught(S,from,o.target,o.mission);else log(S,from,`${MISSIONS[o.mission]} in ${NAT[o.target].name} failed. Your spy got away.`);return}
  if(o.mission==="distrust"){const g=o.alliance?(S.alliances||[]).find(k=>k.id===o.alliance):allianceOf(S,o.target);if(g&&!g.members.includes(from)){dissolveAlliance(S,g,"mutual suspicion");log(S,from,"Your agents sowed enough distrust to break the alliance.")}else log(S,from,`${NAT[o.target].name} has no alliance to break.`);return}
  if(o.mission==="intel"){n.intel[o.target]=S.turn+3;log(S,from,`Intel stolen: you can see all of ${NAT[o.target].name} for 3 turns.`);
    const tN=t.nuke;if(nukes(S)&&tN&&!tN.public&&(tN.progress>0||tN.done)){exposeProgram(S,o.target,"stolen intel from "+NAT[from].name);addGriev(S,o.target,from);log(S,o.target,`${NAT[from].name}'s spies exposed your nuclear program. You can summon their ambassador, and you have grounds for war against them.`)}}
  else if(o.mission==="sabotage"){const rs=owned(S,o.target);const r=rs.includes(o.region)?o.region:rs.sort((a,b)=>S.regions[b].troops-S.regions[a].troops)[0];if(r){const g=S.regions[r],k=Math.ceil(g.troops*0.25);g.troops-=k;log(S,from,`Sabotage destroyed ${k} troops in ${REG[r].n}.`);log(S,o.target,`Saboteurs destroyed ${k} troops in ${REG[r].n}.`)}}
  else if(o.mission==="economy"){const inc=Math.round(income(S,o.target));t.cash=Math.max(0,t.cash-inc);log(S,from,`Sabotage cost ${NAT[o.target].name} a turn of income.`);log(S,o.target,`Saboteurs cost you ${inc} in lost income.`)}
  else if(o.mission==="unrest"){t.unrest=clamp(t.unrest+20,0,100);log(S,from,`Unrest is spreading in ${NAT[o.target].name}.`);log(S,o.target,"Agitators stirred up unrest.");
    if(pol(S)){t.loyalty=clamp((t.loyalty??60)-10,0,100)}else{if(t.gov==="mon"&&chance(0.15))crisis(S,o.target,"agitators");if(t.gov==="dic"&&chance(0.15))coup(S,o.target,"agitators")}}
  else if(o.mission==="rig"){if(t.gov==="dem"){t.rigged=true;log(S,from,`Next ${NAT[o.target].name} election will be rigged.`)}else log(S,from,`${NAT[o.target].name} holds no elections.`)}}

function crisis(S,id,why){const n=S.nations[id];n.support.mon+=5;log(S,"all",`Succession crisis in ${NAT[id].name}: a rival claimant rises (${why}).`);breakAway(S,id,"rival claimant")}
function coup(S,id,why){const n=S.nations[id];n.support.mon+=5;const to=pick(["dem","mon"]);log(S,"all",`Coup in ${NAT[id].name} (${why}).`);changeGov(S,id,to,"coup");n.unrest=clamp(n.unrest-10,0,100)}
function revolution(S,id){const n=S.nations[id];
  if(n.human&&pol(S)&&outOfPower(n)){n.deposed=null;if(n.gov==="dem")n.govParty=myParty(n);n.forced=0;n.oppBlock=false;n.unrest=30;n.maxTurns=0;
    log(S,"all",`Unrest brought down the government of ${NAT[id].name}. Its former leaders were reinstated.`);log(S,id,"Unrest toppled the government that replaced you. You're back in power for the rest of the term, and unrest has dropped to 30.");reviewWars(S,id,"back in power");return}n.support.mon+=5;if(n.climPush)n.climPush.mon+=10;const cl=pol(S)&&n.fac?climate(n):n.support;const opts=Object.keys(GOVN).filter(g=>g!==n.gov).sort((a,b)=>cl[b]-cl[a]);
  log(S,"all",`The government of ${NAT[id].name} was overthrown!`);changeGov(S,id,opts[0],"overthrow");breakAway(S,id,"overthrow");n.unrest=45;n.maxTurns=0}

function offer(S,from,to,kind,extra){const o={id:S.nextOffer++,from,to,kind,turn:S.turn,...extra};S.offers.push(o);return o}

const TRIB_PCTS=[10,20,30];
function termText(o){const p=o.pct||20;return({stopNukes:"they end their nuclear program and sign the treaty",none:"no terms",getTribute:`they pay ${p}% of their treasury`,payTribute:`we pay ${p}% of our treasury`,getRegion:`they cede ${REG[o.region]?.n||"a region"}`,giveRegion:`we cede ${REG[o.region]?.n||"a region"}`}[o.terms||"none"])}
function termsFor(o,viewer){if(viewer!==o.to)return termText(o);const p=o.pct||20,r=REG[o.region]?.n||"a region";return({stopNukes:"you end your nuclear program and sign the treaty",none:"no terms",getTribute:`you pay ${p}% of your treasury`,payTribute:`they pay you ${p}% of their treasury`,getRegion:`you cede ${r}`,giveRegion:`they cede ${r} to you`}[o.terms||"none"])}
function payPct(S,from,to,pct){const amt=Math.max(0,Math.floor(S.nations[from].cash*pct/100));S.nations[from].cash-=amt;S.nations[to].cash+=amt;return amt}
function cede(S,r,from,to){if(S.regions[r]?.owner===from&&S.nations[from].capital!==r){S.regions[r].owner=to;S.regions[r].def=0;log(S,"all",`${NAT[from].name} ceded ${REG[r].n} to ${NAT[to].name}.`);return true}return false}
function applyOffer(S,o,accept,resp){if(o.kind==="allyName"){answerVote(S,o,accept);return}
  if(o.kind==="threatRefused"){const a=o.from,b=o.target;if(resp?.choice==="strike"&&S.nations[a].nuke?.bombs>0){const r=S.regions[resp.region]?.owner===b?resp.region:owned(S,b).filter(x=>!wasted(S,x)).sort((x,y)=>S.regions[y].troops-S.regions[x].troops)[0];if(r)nukeStrike(S,a,r)}else{S.nations[a].unrest=clamp(S.nations[a].unrest+10,0,100);log(S,"all",`${NAT[a].name} backed down from its nuclear threat against ${NAT[b].name}.`)}return}
  if(o.kind==="sanctionAsk"){if(accept)joinSanctions(S,o.to,o.target);return}
  if(o.kind==="incident"){const me=o.to,them=o.from,R=rel(S,me,them);if(!R||R.level===-2||!S.nations[them]?.alive)return;const ch=resp?.choice;
    if(ch==="war")declareWar(S,me,them,"border incident",true);else if(ch==="summon")summon(S,me,them,"a border incident");else log(S,me,`You let the border clash with ${NAT[them].name} pass.`);return}if(o.kind==="event"){applyEvent(S,o,resp?.idx??99);return}if(o.kind==="nukeDone"){if(resp?.choice==="announce")announceBomb(S,o.to);else if(!S.nations[o.to].nuke?.public)log(S,o.to,"You kept your bomb secret. You can still announce it from the Policy tab.");return}
  const a=o.from,b=o.to,R=rel(S,a,b);if(!R||!S.nations[a].alive||!S.nations[b].alive)return;
  const na=NAT[a].name,nb=NAT[b].name,choice=resp?.choice;
  if(o.kind==="ally"){if(accept&&canAlly(R)&&canPair(S,a,b)){const gA=allianceOf(S,a),gB=allianceOf(S,b);if(!gA&&!gB)formAlliance(S,a,b);else if(gA){log(S,"all",`${nb} accepted ${na}'s invitation to ${allyName(S,gA)}. Other members must ratify.`);startJoin(S,gA,b,a)}else{log(S,"all",`${na} asked to join ${allyName(S,gB)}. ${nb} agreed; other members must ratify.`);startJoin(S,gB,a,b)}}else log(S,a,`${nb} declined your alliance${o.why?": "+o.why:""}.`)}
  else if(o.kind==="ratify"){answerJoin(S,o,accept)}

  if(n.gov!=="dem"){n.loyalty+=(loyaltyTarget(S,n)-n.loyalty)*0.2;n.loyalty=clamp(n.loyalty,0,100);
    if(n.loyalty<50){const p=Math.pow((50-n.loyalty)/50,2)*0.35;if(chance(p)){if(n.gov==="dic")coup(S,id,"disloyal army");else crisis(S,id,"disloyal nobles");n.loyalty=45}}}}
/* demands */
const DEMANDS={
  work:[{k:"taxMax",v:25,t:"Keep taxes at 25% or less"},{k:"infraMin",v:20,t:"Put at least 20% of the budget into infrastructure"}],
  bus:[{k:"taxMax",v:25,t:"Keep taxes at 25% or less"},{k:"trade",v:1,t:"Sign a new trade deal this term"}],
  nat:[{k:"milMin",v:45,t:"Spend at least 45% on troops and defenses"},{k:"capture",v:1,t:"Capture a region this term"}],
  ref:[{k:"propMax",v:5,t:"Spend 5% or less on propaganda"},{k:"noWar",v:0,t:"Start no new wars this term"}]};
function makeDemand(S,id){const n=S.nations[id];if(n.deposed){n.demand=null;return}if(n.gov==="dem"&&!govMine(n)){n.demand=null;return}let best=null,bv=-1;for(const f of FAC){const v=n.fac[f].size*(100-n.fac[f].appr);if(v>bv){bv=v;best=f}}
  const d=pick(DEMANDS[best]);n.demand={f:best,...d,start:S.turn,trades:tradeCount(S,id),wins:n.termWins,wars:0};S.log.push({t:Math.max(0,S.turn-1),to:id,text:`${FACN[best]} demand for the coming term: ${d.t}. Set your policy this turn to meet it.`})}
function demandMet(S,id){const n=S.nations[id],d=n.demand;if(!d)return true;const b=n.budget;
  return d.k==="taxMax"?n.tax<=d.v:d.k==="infraMin"?b.infra>=d.v:d.k==="milMin"?(b.troops+b.def)>=d.v:d.k==="propMax"?b.prop<=d.v:d.k==="trade"?tradeCount(S,id)>d.trades:d.k==="capture"?n.termWins>0:d.k==="noWar"?!(d.wars>0):true}
function settleDemand(S,id){const n=S.nations[id],d=n.demand;if(!d)return;if(!n.good)n.good={work:0,bus:0,nat:0,ref:0};
  if(demandMet(S,id)){appr(n,d.f,10);n.good[d.f]+=12;addLean(n,d.f,10);log(S,id,`You met the ${FACN[d.f]}' demand. They're grateful and lean your way.`)}
  else{appr(n,d.f,-10);n.good[d.f]-=10;addLean(n,d.f,-20);log(S,id,`You ignored the ${FACN[d.f]}' demand. They're backing the opposition.`)}n.demand=null}
/* political actions on campaign / consolidation turns */
function runPolAction(S,id,o){const n=S.nations[id],kind=polTurnKind(S,n);if(!kind)return;const c=POL_COST[o.kind]??0;
  const dem=["campaign","rally","attackOpp"],cons=["reward","purge","suppress"],str=["bribe","loyalists"];if(!(kind==="campaign"?dem:kind==="struggle"?str:cons).includes(o.kind))return;if(c&&!spend(S,id,c))return;
  if(o.kind==="bribe"){n.deposed.support=clamp(n.deposed.support+8,0,100);log(S,id,`You bribed officers. Your support: ${Math.round(n.deposed.support)}.`);return}
  if(o.kind==="loyalists"){n.deposed.support=clamp(n.deposed.support+3,0,100);log(S,id,`You rallied your loyalists. Your support: ${Math.round(n.deposed.support)}.`);return}
  if(o.kind==="campaign"){const r=S.regions[o.region]?.owner===id?o.region:n.capital;n.camp.regions[r]=(n.camp.regions[r]||0)+12;log(S,id,`Campaigned in ${REG[r].n}.`)}
  else if(o.kind==="rally"){const f=FAC.includes(o.faction)?o.faction:FAC[0];if(n.gov==="dem"&&!govMine(n)){addLean(n,f,14);log(S,id,`Rallied the ${FACN[f]} against the government.`)}else{appr(n,f,8);addLean(n,f,6);log(S,id,`Rallied the ${FACN[f]}.`)}}
  else if(o.kind==="attackOpp"){if(chance(0.25)){n.camp.nat-=4;log(S,id,"Your attack on the opposition backfired.")}else{n.camp.nat+=4;log(S,id,"Your attack on the opposition landed.")}}
  else if(o.kind==="reward"){n.loyalty=clamp(n.loyalty+12,0,100);log(S,id,`Rewarded ${n.gov==="dic"?"the generals":"the nobility"}. Loyalty rose.`)}
  else if(o.kind==="purge"){n.loyalty=clamp(n.loyalty+15,0,100);n.unrest=clamp(n.unrest+8,0,100);const w=FAC.reduce((a,f)=>n.fac[f].appr<n.fac[a].appr?f:a,FAC[0]);appr(n,w,-10);log(S,"all",`${NAT[id].name} carried out a purge.`)}
  else if(o.kind==="suppress"){const w=FAC.reduce((a,f)=>n.fac[f].appr<n.fac[a].appr?f:a,FAC[0]);facShift(n,w,-6);n.rep-=1;n.unrest=clamp(n.unrest+4,0,100);log(S,"all",`${NAT[id].name} cracked down on the ${FACN[w]}.`)}}
/* regional election */
function electionProjection(S,id){const n=S.nations[id],govA=govMine(n),affGov=n.govParty==="A"?1:-1,fatigue=Math.min(9,(n.govTerms||0)*3);const fac={};let base=0;
  for(const f of FAC){const g=clamp(50+affGov*FAC_AFF[f]+(n.fac[f].appr-50)*0.6+(govA?1:-1)*n.lean[f]-fatigue,5,95);fac[f]=Math.round(govA?g:100-g);base+=n.fac[f].size/100*g}
  const rows=[];let tot=0,wsum=0;
  for(const r of owned(S,id)){const g=S.regions[r];let v=base+g.infra*3+(r===n.capital?5:0)-(g.hit>=S.turn-4?3:0)-(g.taken>=S.turn-9?4:0)+(govA?1:-1)*((n.camp.regions[r]||0)+n.camp.nat);
    v=clamp(v,5,95);rows.push({r,v:Math.round(govA?v:100-v),pop:g.pop});tot+=g.pop*v;wsum+=g.pop}
  const govShare=wsum?tot/wsum:50;return{you:Math.round(govA?govShare:100-govShare),rows,fac,fatigue,govA}}
function runElection(S,id){const n=S.nations[id],P=electionProjection(S,id);let youWin=P.you>=50;if(n.rigged){youWin=!youWin;n.rigged=false;log(S,id,"Foreign interference suspected in the election. The result doesn't match the polls.")}
  n.lastElection={turn:S.turn,share:P.you,rows:P.rows,won:youWin};const was=n.govParty,mine=myParty(n);n.govParty=youWin?mine:other(mine);n.govTerms=(n.govParty===was)?(n.govTerms||0)+1:0;n.camp={regions:{},nat:0};
  const detail=[...P.rows].sort((a,b)=>b.pop-a.pop).slice(0,4).map(x=>`${REG[x.r].n} ${x.v}%`).join(", ");
  log(S,id,`Election: your ${PARTY[mine]} took ${P.you}% (${detail}).`);
  if(youWin){n.forced=0;n.oppBlock=false;log(S,"all",`${NAT[id].name}: the ${PARTY[mine]} ${was===mine?"held power":"returned to power"}.`)}
  else{n.forced=5;n.oppBlock=true;log(S,"all",`${NAT[id].name}: the ${PARTY[other(mine)]} won the election. It sets policy for 5 turns and can block one declaration of war.`);if(was===mine){reviewWars(S,id,"election",true);nukeReview(S,id,"The new government")}}
  if(youWin&&was!==mine)reviewWars(S,id,"back in power")}
/* events */
const EVENTS=[
  {id:"taxprotest",when:n=>n.tax>25,t:"Workers are protesting high taxes.",c:[["Cut taxes 5%",n=>{n.tax=Math.max(0,n.tax-5);appr(n,"work",6)}],["Spend 20 money to calm them",(n,S,id)=>{if(spend(S,id,20)){n.unrest=clamp(n.unrest-5,0,100);appr(n,"work",5)}else appr(n,"work",-10)},20],["Ignore them",n=>{appr(n,"work",-10);n.unrest=clamp(n.unrest+5,0,100)}]]},
  {id:"scandal",t:"A government scandal breaks.",c:[["Fire the ministers (15 money)",(n,S,id)=>{if(spend(S,id,15))appr(n,"ref",5);else appr(n,"ref",-8)},15],["Cover it up",n=>{if(chance(0.4)){appr(n,"ref",-15);n.unrest=clamp(n.unrest+10,0,100)}}],["Ride it out",n=>{for(const f of FAC)appr(n,f,-5)}]]},
  {id:"strike",when:n=>n.fac.work.appr<45,t:"A general strike shuts down factories.",c:[["Raise wages (20 money)",(n,S,id)=>{if(spend(S,id,20))appr(n,"work",10);else appr(n,"work",-15)},20],["Break the strike",n=>{appr(n,"work",-15);appr(n,"bus",5);n.unrest=clamp(n.unrest+6,0,100)}]]},
  {id:"parade",t:"Nationalists want a military parade.",c:[["Hold it (15 money)",(n,S,id)=>{if(spend(S,id,15)){appr(n,"nat",10);appr(n,"ref",-5)}},15],["Decline",n=>appr(n,"nat",-5)]]},
  {id:"corruption",when:n=>(n.budget.infra||0)>0,t:"Corruption allegations hit public works.",c:[["Investigate (15 money)",(n,S,id)=>{if(spend(S,id,15)){appr(n,"ref",8);appr(n,"bus",-5)}},15],["Ignore",n=>{appr(n,"ref",-8);n.unrest=clamp(n.unrest+4,0,100)}]]},
  {id:"boom",t:"An economic boom lifts the country.",auto:(n,S,id)=>{n.cash+=Math.round(income(S,id));appr(n,"bus",8)}},
  {id:"reform",t:"A reform movement is gathering pace.",auto:n=>{facShift(n,"ref",3);n.climPush.dem+=10}},
  {id:"rally",t:"A patriotic rally sweeps the country.",auto:n=>{appr(n,"nat",8);n.unrest=clamp(n.unrest-5,0,100)}},
  {id:"project",when:(n,S,id)=>owned(S,id).some(r=>S.regions[r].infra>0),t:"A popular public works project opens.",auto:n=>{appr(n,"bus",5);appr(n,"work",5)}},
  {id:"assassination",t:"A political assassination shocks the nation.",surprise:true,auto:n=>{appr(n,pick(FAC),-15);n.unrest=clamp(n.unrest+10,0,100)}}];
function fireEvent(S,id,surprise){const n=S.nations[id];const ok=e=>!e.when||e.when(n,S,id);const pool=EVENTS.filter(e=>(surprise?(e.surprise||e.auto):!e.surprise)&&ok(e));if(!pool.length)return;const e=pick(pool);
  if(e.auto){e.auto(n,S,id);log(S,id,`Event: ${e.t}`);return}
  if(n.human&&!outOfPower(n)){offer(S,id,id,"event",{ev:e.id});log(S,id,`Event: ${e.t} Decide on the Politics tab.`)}
  else if(n.human){const opts=e.c.map((c,i)=>i).filter(i=>!e.c[i][2]||n.cash>=e.c[i][2]);const i=opts.length?opts[0]:e.c.length-1;e.c[i][1](n,S,id);log(S,id,`Event: ${e.t} ${n.deposed?"The regime":"The governing party"} chose: ${e.c[i][0]}.`)}
  else{const opts=e.c.map((c,i)=>i).filter(i=>!e.c[i][2]||n.cash>=e.c[i][2]);const i=opts.length?opts[0]:e.c.length-1;e.c[i][1](n,S,id);log(S,id,`Event: ${e.t} ${e.c[i][0]}.`)}}
function applyEvent(S,o,choice){const e=EVENTS.find(x=>x.id===o.ev),n=S.nations[o.to];if(!e||!e.c)return;const i=clamp(choice|0,0,e.c.length-1);e.c[i][1](n,S,o.to);log(S,o.to,`${e.t} You chose: ${e.c[i][0]}.`)}
/* robots */
function botPolitics(S,id){const n=S.nations[id],O=[];const kind=polTurnKind(S,n);if(!kind)return O;
  if(kind==="campaign"){const rs=owned(S,id).sort((a,b)=>S.regions[b].pop-S.regions[a].pop);let cash=n.cash;
    for(const r of rs.slice(0,2))if(cash>=POL_COST.campaign+5){O.push({t:"pol",kind:"campaign",region:r});cash-=POL_COST.campaign}
    const w=FAC.reduce((a,f)=>n.fac[f].appr<n.fac[a].appr?f:a,FAC[0]);if(cash>=POL_COST.rally)O.push({t:"pol",kind:"rally",faction:w})}
  else{if(n.loyalty<55&&n.cash>=POL_COST.reward)O.push({t:"pol",kind:"reward"});if(n.loyalty<35)O.push({t:"pol",kind:"purge"});
    const w=FAC.reduce((a,f)=>n.fac[f].appr<n.fac[a].appr?f:a,FAC[0]);if(n.fac[w].appr<25&&n.fac[w].size>30)O.push({t:"pol",kind:"suppress"})}
  return O.slice(0,ACTION_CAP)}
function botMeetDemand(S,id){const n=S.nations[id],d=n.demand;if(!d||n.forced>0)return;const b=n.budget;
  if(d.k==="taxMax")n.tax=Math.min(n.tax,d.v);if(d.k==="infraMin"&&b.infra<d.v){b.troops=Math.max(0,b.troops-(d.v-b.infra));b.infra=d.v}
  if(d.k==="milMin"&&b.troops+b.def<d.v){const need=d.v-b.troops-b.def;b.troops+=need;b.res=Math.max(0,b.res-need)}if(d.k==="propMax")b.prop=Math.min(b.prop,d.v);
  const K=["troops","def","infra","prop"],s=K.reduce((a,k)=>a+b[k],0);if(s>100){for(const k of K)b[k]=Math.floor(b[k]*100/s)}b.res=100-K.reduce((a,k)=>a+b[k],0)}

/* ===== NUCLEAR PROGRAM (optional) ===== */
const NUKE_TURNS=8,NUKE_FUND=15,NUKE_MAX=3,NUKE_EVERY=5,NUKE_LEAK=0.04,WASTE_TURNS=5;
const nukes=S=>!!S.opts?.nukes;
const hasPublicBomb=(S,id)=>nukes(S)&&S.nations[id]?.nuke?.public&&S.nations[id].nuke.bombs>0;
function nk(n){if(!n.nuke)n.nuke={on:false,progress:0,done:false,public:false,bombs:0,lastBuild:0};return n.nuke}
function exposeProgram(S,id,how){const n=S.nations[id],N=nk(n);if(N.public)return;N.public=true;goesPublic(S,id);natBomb(S,id);
  log(S,"all",`${NAT[id].name}'s secret nuclear ${N.done?"arsenal":"program"} was exposed (${how}).`);
  for(const o of alive(S)){if(o===id)continue;const R=rel(S,id,o);if(!R||R.level===-2)continue;if(R.trade){R.trade=false}S.nations[id].tradeBlock=S.turn+2;
    setLevel(S,id,o,Math.max(-1,R.level-1));if(rel(S,id,o).level===-1)addGriev(S,o,id)}
  log(S,"all",`Trade deals with ${NAT[id].name} were cancelled and its ambassadors summoned.`);sanctionPrompt(S,id)}
function announceBomb(S,id){const N=nk(S.nations[id]);if(N.public)return;N.public=true;goesPublic(S,id);natBomb(S,id);log(S,"all",`${NAT[id].name} tested a nuclear bomb. The world now knows it has the bomb.`);sanctionPrompt(S,id);
  for(const o of alive(S)){if(o===id)continue;const R=rel(S,id,o);if(R&&R.level>-2)setLevel(S,id,o,Math.max(-1,R.level-1))}}
function nukeEconomy(S,id,inc){const n=S.nations[id],N=nk(n);if(!nukes(S)||N.done||!N.on)return inc;
  N.progress++;if(!N.public&&chance(NUKE_LEAK))exposeProgram(S,id,"leak");
  if(N.progress>=NUKE_TURNS){N.done=true;N.on=false;N.bombs=1;N.lastBuild=S.turn;log(S,id,"Your nuclear program succeeded. You have a bomb.");
    if(!N.public){if(n.human)offer(S,id,id,"nukeDone");else if(chance(0.6))announceBomb(S,id)}}
  return inc*(100-NUKE_FUND)/100}
function nukeStockpile(S,id){const N=nk(S.nations[id]);if(N.done&&N.bombs>=NUKE_MAX){N.lastBuild=S.turn;return}if(N.done&&N.bombs<NUKE_MAX&&S.turn-N.lastBuild>=NUKE_EVERY){N.bombs++;N.lastBuild=S.turn;log(S,id,`Your stockpile grew to ${N.bombs} bomb${N.bombs>1?"s":""}.`)}}
const wasted=(S,r)=>(S.regions[r].waste||0)>S.turn;
function nukeStrike(S,id,r){const n=S.nations[id],N=nk(n),g=S.regions[r];if(!nukes(S)||N.bombs<=0||!g||wasted(S,r)||g.owner===id||S.turn<CEASEFIRE)return;
  const tw=g.owner;if(tw&&allied(S,id,tw))return;if(!N.public){N.public=true;goesPublic(S,id);natBomb(S,id);sanctionPrompt(S,id)}N.bombs--;
  if(tw&&!atWar(S,id,tw))declareWar(S,id,tw,"nuclear strike",true);
  g.troops=0;g.def=0;g.guest=null;g.infra=0;g.pop=Math.max(1,Math.floor(g.pop*0.1));g.owner=null;g.waste=S.turn+WASTE_TURNS;
  if(tw){const tn=S.nations[tw];if(tn.capital===r){tn.capital=null}tn.lostThisTurn++;tn.termLosses++;tn.nukedBy=tn.nukedBy||{};tn.nukedBy[id]=(tn.nukedBy[id]||0)+33.3}
  log(S,"all",`☢ ${NAT[id].name} dropped a nuclear bomb on ${REG[r].n}. The region is a wasteland for ${WASTE_TURNS} turns.`);
  for(const o of alive(S)){if(o===id||o===tw)continue;const R=rel(S,id,o);if(!R||R.level===-2)continue;
    if(R.level===2){if(chance(0.5)){setLevel(S,id,o,-1);log(S,"all",`${NAT[o].name} broke its alliance with ${NAT[id].name} over the nuclear strike.`)}continue}
    setLevel(S,id,o,Math.max(-1,R.level-2));addGriev(S,o,id)}
  S.nations[id].rep-=3}
function botNukes(S,id){const n=S.nations[id],N=nk(n),O=[];if(!nukes(S))return O;
  if(!N.done&&!N.on&&S.turn>=8&&isPolicyTurn(S)&&!inNPT(S,id)&&chance(["warlord","schemer"].includes(n.pers)?0.4:0.2))O.push({t:"nukeToggle",on:true});
  if(N.bombs>0&&S.turn>=CEASEFIRE){const my=strength(S,id);for(const e of alive(S)){if(e===id||!atWar(S,id,e))continue;
    if(my<strength(S,e)*0.7&&chance(n.diff==="hard"||n.pers==="warlord"?0.15:0.05)){const t=owned(S,e).filter(r=>!wasted(S,r)).sort((a,b)=>S.regions[b].troops-S.regions[a].troops)[0];if(t){O.push({t:"nukeStrike",region:t});break}}}}
  return O}

/* ===== NUCLEAR DIPLOMACY ===== */
const inNPT=(S,id)=>(S.npt||[]).includes(id);
const knownProgram=(S,id)=>{const N=S.nations[id]?.nuke;return !!(N&&N.public&&!N.done&&(N.on||N.progress>0))};
const knownBombs=(S,id)=>{const N=S.nations[id]?.nuke;return !!(N&&N.public&&N.bombs>0)};
function dismantle(S,id){const N=nk(S.nations[id]);N.on=false;N.progress=0;N.done=false;N.bombs=0;N.public=false;N.pubSince=null;N.accepted=false;N.natBoost=false}
function joinNPT(S,id,why){if(inNPT(S,id))return;S.npt=S.npt||[];const N=nk(S.nations[id]);const had=N.bombs>0||N.progress>0;dismantle(S,id);
  for(const o of S.npt){if(!S.nations[o]?.alive)continue;const R=rel(S,id,o);if(R&&R.level>-2&&R.level<1)setLevel(S,id,o,R.level+1)}S.npt.push(id);
  log(S,"all",`${NAT[id].name} signed the non-proliferation treaty${had?" and dismantled its nuclear "+(N.bombs?"arsenal":"program"):""}${why?" ("+why+")":""}.`);
  if(S.sanctions?.[id]){delete S.sanctions[id];log(S,"all",`Sanctions on ${NAT[id].name} were lifted.`)}}
function leaveNPT(S,id){if(!inNPT(S,id))return;S.npt=S.npt.filter(x=>x!==id);for(const o of S.npt){if(!S.nations[o]?.alive)continue;const R=rel(S,id,o);if(R&&R.level>-2)setLevel(S,id,o,Math.max(-1,R.level-2))}
  log(S,"all",`${NAT[id].name} withdrew from the non-proliferation treaty. Relations with every signer fell sharply.`)}
function joinSanctions(S,by,t){if(!(knownBombs(S,t)||knownProgram(S,t))||by===t)return;S.sanctions=S.sanctions||{};const L=S.sanctions[t]=S.sanctions[t]||[];if(L.includes(by))return;L.push(by);const R=rel(S,by,t);if(R?.trade)R.trade=false;
  log(S,"all",`${NAT[by].name} joined sanctions against ${NAT[t].name} (${L.length} nation${L.length>1?"s":""}).`)}
function leaveSanctions(S,by,t){const L=S.sanctions?.[t];if(!L||!L.includes(by))return;S.sanctions[t]=L.filter(x=>x!==by);if(!S.sanctions[t].length)delete S.sanctions[t];log(S,"all",`${NAT[by].name} left the sanctions against ${NAT[t].name}.`)}
const sanctionPair=(S,a,b)=>(S.sanctions?.[a]||[]).includes(b)||(S.sanctions?.[b]||[]).includes(a);
function sanctionHit(S,id,inc){const k=(S.sanctions?.[id]||[]).filter(x=>S.nations[x]?.alive).length;if(!k)return inc;const n=S.nations[id];n.unrest=clamp(n.unrest+3*k,0,100);return inc*Math.max(0,1-0.1*k)}
function stopProgram(S,id,why){const N=nk(S.nations[id]);N.on=false;N.progress=0;joinNPT(S,id,why)}
function botNukeDiplo(S,id){const n=S.nations[id],O=[];if(!nukes(S))return O;const N=nk(n);
  if(isPolicyTurn(S)&&!inNPT(S,id)&&!N.done&&!N.on&&N.progress===0&&chance(0.25))O.push({t:"npt",join:true});
  if(S.sanctions?.[id]?.length>=2&&n.unrest>50&&chance(0.5))O.push({t:"npt",join:true});
  for(const o of alive(S)){if(o===id)continue;const R=rel(S,id,o);if(!R)continue;
    if(knownProgram(S,o)&&R.level<=0&&!S.offers.some(x=>x.from===id&&x.to===o&&x.kind==="nukeStop")&&chance(0.15))O.push({t:"dip",kind:"nukeStop",target:o});

      if(k==="peace")Object.assign(o,parseTerms($("#terms-"+id)?.value));
      if(k==="tribute"){const v=$("#trib-"+id)?.value||"20";if(v.startsWith("r:"))o.region=v.slice(2);else o.pct=+v}
      if((k==="tribute"||k==="nukeStop")&&$("#thr-"+id)?.checked)o.threat=true;addOrder(o);break}
    case"spyDistrust":{const gid=+$("#spyA").value,g=(S.alliances||[]).find(k=>k.id===gid);if(!g)break;addOrder({t:"spy",mission:"distrust",alliance:gid,target:g.members.find(m=>S.nations[m]?.alive)});break}
    case"spy":{const t=$("#spyT").value,m=$("#spyM").value;addOrder({t:"spy",target:t,mission:m});toast("Spy dispatched when the turn ends");break}
    case"savePol":{const b={};for(const k of ["troops","def","infra","prop"])b[k]=+$("#b-"+k).value;const tot=Object.values(b).reduce((a,x)=>a+x,0);if(tot>100){toast("Allocations can't exceed 100%");break}b.res=100-tot;polDraft=null;addOrder({t:"policy",tax:+$("#tax").value,budget:b});toast("Policy set for this term");break}
    case"recruit":{const k=+$("#rec").value;if(S.nations[myNat].cash-spendQueued()<k*COST.troop){toast("Not enough in the treasury");break}myOrders=myOrders.filter(x=>x.t!=="recruit");addOrder({t:"recruit",n:k,region:$("#recR").value});break}
    case"endTurn":document.activeElement?.blur?.();actx();{const bl=endBlockers();if(bl.length){toast(bl[0]);armEnd=false;break}}
      if(!armEnd){armEnd=true;clearTimeout(armT);armT=setTimeout(()=>{armEnd=false;render()},3000);render();break}
      armEnd=false;clearTimeout(armT);if(mode==="solo")endTurnSolo();else submitOrders();break}});

/* ---------- boot ---------- */
(async()=>{render();
  if(firebaseConfig.apiKey){try{const fa=initializeApp(firebaseConfig),auth=getAuth(fa);await signInAnonymously(auth);me=auth.currentUser.uid;db=makeDb(getFirestore(fa))}catch{toast("Online play unavailable right now")}}
  const inv=new URLSearchParams(location.search).get("g");if(inv&&db){history.replaceState(null,"",location.pathname);setup={nat:null,diff:"normal",opts:{}};joinLobby(inv)}else render()})();

</script>
</body>
</html>
